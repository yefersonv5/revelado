<style>
__STYLES__
</style>

<div id="app">
  <!-- ======================= Biblioteca ======================= -->
  <section id="v-biblioteca" class="vista">
    <header class="barra">
      <button class="txt" id="b-seleccionar">Seleccionar</button>
      <span class="flex"></span>
      <label class="ib" for="f-importar" aria-label="Importar fotos" title="Importar fotos">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </label>
      <input id="f-importar" class="oculto" type="file" accept="image/*" multiple>
    </header>
    <div class="desliza" id="bib-desliza">
      <h1 class="titulo-lg">Biblioteca</h1>
      <div class="segmento" id="filtros" role="tablist">
        <button data-filtro="todas" aria-selected="true">Todas</button>
        <button data-filtro="editadas" aria-selected="false">Editadas</button>
        <button data-filtro="favoritas" aria-selected="false">Favoritas</button>
      </div>
      <div id="rejilla"></div>
      <div id="vacio" class="vacio" hidden>
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m21 15-4.5-4.5L7 19"/></svg>
        <b>Tu biblioteca está vacía</b>
        <p>Importa fotos de tu galería para empezar a revelar. Se guardan solo en este dispositivo.</p>
        <label class="btn primario" for="f-importar">Importar fotos</label>
        <button class="btn" id="b-ejemplo">Probar con una foto de ejemplo</button>
      </div>
    </div>
    <nav class="barra-inf" id="barra-sel" hidden>
      <button class="txt" data-sel="pegar" disabled>Pegar ajustes</button>
      <button class="txt" data-sel="favorita" disabled>Favorita</button>
      <button class="txt peligro" data-sel="eliminar" disabled>Eliminar</button>
    </nav>
  </section>

  <!-- ======================= Editor ======================= -->
  <section id="v-editor" class="vista" hidden>
    <header class="barra">
      <button class="txt volver" id="b-volver" aria-label="Volver a la biblioteca">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Biblioteca
      </button>
      <span class="flex"></span>
      <button class="ib" id="b-deshacer" aria-label="Deshacer" title="Deshacer" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="ib" id="b-rehacer" aria-label="Rehacer" title="Rehacer" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="ib" id="b-mas" aria-label="Más opciones" title="Más opciones"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="12" r=".6" class="lleno"/><circle cx="12" cy="12" r=".6" class="lleno"/><circle cx="16" cy="12" r=".6" class="lleno"/></svg></button>
      <button class="ib" id="b-exportar" aria-label="Exportar" title="Exportar"><svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="m7.5 7.5 4.5-4.5 4.5 4.5"/><path d="M8 10H6.5A1.5 1.5 0 0 0 5 11.5v8A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-8a1.5 1.5 0 0 0-1.5-1.5H16"/></svg></button>
    </header>

    <div id="escena" aria-label="Foto. Mantén presionada para ver el original">
      <div id="marco">
        <canvas id="lienzo"></canvas>
        <svg id="capa" aria-hidden="true"></svg>
      </div>
      <canvas id="histo" width="240" height="96" hidden></canvas>
      <span id="etq-antes" class="pastilla">Original</span>
      <span id="etq-zoom" class="pastilla"></span>
    </div>

    <div id="lateral">
      <div id="panel">
        <div class="pane" id="p-presets"></div>
        <div class="pane" id="p-recortar" hidden></div>
        <div class="pane" id="p-mascaras" hidden></div>
        <div class="pane" id="p-luz" hidden></div>
        <div class="pane" id="p-color" hidden></div>
        <div class="pane" id="p-efectos" hidden></div>
        <div class="pane" id="p-detalle" hidden></div>
      </div>
      <nav id="herramientas" role="tablist">
        <button role="tab" data-p="presets" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Presets</button>
        <button role="tab" data-p="recortar" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M2 6h14a2 2 0 0 1 2 2v14"/></svg>Recortar</button>
        <button role="tab" data-p="mascaras" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" class="lleno"/></svg>Máscaras</button>
        <button role="tab" data-p="luz" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Luz</button>
        <button role="tab" data-p="color" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="5.5"/><circle cx="15" cy="9" r="5.5"/><circle cx="12" cy="15" r="5.5"/></svg>Color</button>
        <button role="tab" data-p="efectos" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5" stroke-dasharray="2 2.4"/></svg>Efectos</button>
        <button role="tab" data-p="detalle" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 21 21 3"/><path d="M8 3H3v5M16 21h5v-5"/><circle cx="12" cy="12" r="2.2"/></svg>Detalle</button>
      </nav>
    </div>
  </section>
</div>

<div id="scrim" hidden></div>
<div id="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo" hidden></div>
<div id="aviso" role="status" hidden></div>

<script>
__SCRIPT__
</script>
