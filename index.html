/* ---------- subvistas ---------- */
let bandaSel = 'rojo', zonaSel = 'sombras';
function abrirSub(pane, cual){
  const sub = $('.subvista', pane), reabrir = pane.dataset.abierta === cual;
  $('.principal', pane).hidden = true; sub.hidden = false; pane.dataset.abierta = cual; if (!reabrir) pane.scrollTop = 0;
  if (cual === 'curva') {
    sub.innerHTML = pcabSub('Curva') + htmlCurva();
    montarCurva(sub, () => ED.a.curva, final => final === null ? abrirSub(pane, 'curva') : cambiar(final));
  }
  if (cual === 'mezcla') pintarMezcla(sub);
  if (cual === 'gradacion') pintarGradacion(sub);
}
function cerrarSub(pane){ const sub = $('.subvista', pane); sub.hidden = true; sub.innerHTML = ''; delete pane.dataset.abierta; $('.principal', pane).hidden = false; sincronizarPaneles(); }

/* Mezcla de color; en blanco y negro se vuelve la mezcla de grises: un deslizador de luminancia por color */
function pintarMezcla(sub){
  if (perfilDe(ED.a).bn) {
    sub.innerHTML = pcabSub('Mezcla de blanco y negro', '<button class="txt" data-reset-mezcla>Restablecer</button>') + '<div class="ctls"></div>';
    BANDAS.forEach(b => $('.ctls', sub).appendChild(ctlAjuste({ k:'m_' + b.k + '_l', nom:b.nom, riel:'linear-gradient(90deg,#111,' + b.color + ',#fff)' })));
  } else {
    const b = BANDAS.find(x => x.k === bandaSel), h0 = b.hue;
    const rielTono = 'linear-gradient(90deg,' + [-30, 0, 30].map(d => 'hsl(' + (h0 + d + 360) % 360 + ',75%,55%)').join(',') + ')';
    sub.innerHTML = pcabSub('Mezcla de color', '<button class="txt" data-reset-mezcla>Restablecer</button>') +
      '<div class="puntos" role="radiogroup" aria-label="Color">' + BANDAS.map(x => '<button data-banda="' + x.k + '" style="background:' + x.color + '" class="' + (x.k === bandaSel ? 'activo' : '') + '" aria-label="' + x.nom + '"></button>').join('') + '</div><div class="ctls"></div>';
    const c = $('.ctls', sub);
    c.appendChild(ctlAjuste({ k:'m_' + b.k + '_h', nom:'Tono', riel:rielTono }));
    c.appendChild(ctlAjuste({ k:'m_' + b.k + '_s', nom:'Saturación', riel:'linear-gradient(90deg,#777,' + b.color + ')' }));
    c.appendChild(ctlAjuste({ k:'m_' + b.k + '_l', nom:'Luminancia', riel:'linear-gradient(90deg,#111,' + b.color + ',#fff)' }));
  }
  sub.onclick = e => {
    const p = e.target.closest('[data-banda]'); if (p) { bandaSel = p.dataset.banda; pintarMezcla(sub); }
    if (e.target.closest('[data-reset-mezcla]')) { CLAVES_MEZCLA.forEach(k => { ED.a[k] = 0; }); cambiar(true); pintarMezcla(sub); }
  };
}

function pintarGradacion(sub){
  const z = zonaSel;
  sub.innerHTML = pcabSub('Gradación de color', '<button class="txt" data-reset-grad>Restablecer</button>') +
    '<div class="segmento" role="tablist">' + ZONAS.map(x => '<button data-zona="' + x.k + '" aria-selected="' + (x.k === z) + '">' + (x.k === 'medios' ? 'Medios' : x.nom) + '</button>').join('') + '</div>' +
    '<div class="ruedas"><div class="rueda" role="slider" aria-label="Tono y saturación de ' + z + '" tabindex="0"><span class="p"></span></div></div><div class="ctls"></div>';
  const c = $('.ctls', sub);
  c.appendChild(ctlAjuste({ k:'g_' + z + '_l', nom:'Luminancia', riel:'linear-gradient(90deg,#111,#fff)' }));
  c.appendChild(ctlAjuste({ k:'g_mezcla', nom:'Mezcla', min:0, max:100 }));
  c.appendChild(ctlAjuste({ k:'g_balance', nom:'Balance' }));
  const rueda = $('.rueda', sub), punto = $('.p', rueda);
  const pintarPunto = () => {
    const h = ED.a['g_' + z + '_h'] * Math.PI / 180, s = ED.a['g_' + z + '_s'] / 100;
    punto.style.left = (50 + Math.cos(h) * s * 50) + '%'; punto.style.top = (50 - Math.sin(h) * s * 50) + '%';
    const [r, g, b] = hsvRgb(ED.a['g_' + z + '_h'] / 360); punto.style.background = 'rgb(' + [r, g, b].map(v => Math.round(128 + (v * 255 - 128) * s)).join(',') + ')';
  };
  const mover = (e, final) => {
    const r = rueda.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 2 - 1, y = 1 - (e.clientY - r.top) / r.height * 2;
    let s = Math.min(1, Math.hypot(x, y)); if (s < .04) s = 0;
    ED.a['g_' + z + '_h'] = Math.round(((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360); ED.a['g_' + z + '_s'] = Math.round(s * 100);
    pintarPunto(); cambiar(final);
  };
  let ultimo = 0;
  rueda.addEventListener('pointerdown', e => {
    e.preventDefault(); rueda.setPointerCapture(e.pointerId);
    const ahora = Date.now(); if (ahora - ultimo < 320) { ED.a['g_' + z + '_s'] = 0; pintarPunto(); cambiar(true); ultimo = 0; return; }
    ultimo = ahora; mover(e, false);
  });
  rueda.addEventListener('pointermove', e => { if (rueda.hasPointerCapture(e.pointerId)) mover(e, false); });
  rueda.addEventListener('pointerup', e => { if (rueda.hasPointerCapture(e.pointerId)) mover(e, true); });
  pintarPunto();
  sub.onclick = e => {
    const zb = e.target.closest('[data-zona]'); if (zb) { zonaSel = zb.dataset.zona; pintarGradacion(sub); }
    if (e.target.closest('[data-reset-grad]')) { CLAVES_GRAD.forEach(k => { ED.a[k] = DEF[k]; }); cambiar(true); pintarGradacion(sub); }
  };
}

/* Actualiza los deslizadores visibles, lo que depende de otro ajuste, los estados y los puntos de "editado" */
function sincronizarPaneles(){
  const a = ED.a, p = perfilDe(a);
  $$('#panel .ctl').forEach(c => { if (c.sync) c.sync(); if (c.dataset.depende) c.hidden = a[c.dataset.depende] === DEF[c.dataset.depende]; });
  $$('#panel .fila-nav[data-sub]').forEach(f => {
    const k = f.dataset.sub;
    f.classList.toggle('editado', k === 'curva' ? curvaEditada(a.curva) : k === 'mezcla' ? cambiado(a, CLAVES_MEZCLA) : cambiado(a, CLAVES_GRAD));
    if (k === 'mezcla') $('b', f).textContent = p.bn ? 'Mezcla de blanco y negro' : 'Mezcla de color';
  });
  $$('#tratamiento button').forEach(b => b.setAttribute('aria-selected', (b.dataset.trat === 'bn') === !!p.bn));
  $('#perfil-nom').textContent = p.nom + (a.perfil.cant !== 100 ? ' · ' + a.perfil.cant + ' %' : '');
  const bb = BB_NOMBRE(a);
  $$('[data-bb]').forEach(b => b.classList.toggle('activo', b.dataset.bb === 'gotero' ? ED.modoToque === 'bb' : (b.dataset.bb === 'como' ? bb === 'Como se tomó' : bb === 'Automático')));
  $('[data-restringir]').classList.toggle('activo', !!a.restringir);
  const ed = {
    presets:!!ED.preset, recortar:!!geoEditada(a.geo), mascaras:a.mascaras.length > 0, quitar:a.manchas.length > 0, desenfoque:a.desenfoque.cant > 0,
    luz:cambiado(a, CLAVES.luz) || curvaEditada(a.curva), color:cambiado(a, CLAVES.color) || a.perfil.id !== 'color', efectos:cambiado(a, CLAVES.efectos),
    detalle:cambiado(a, CLAVES.detalle), optica:cambiado(a, CLAVES.optica), geometria:cambiado(a, CLAVES.geometria), versiones:ED.foto && ED.foto.versiones.length > 0,
  };
  $$('#herramientas button').forEach(b => b.classList.toggle('editado', !!ed[b.dataset.p]));
}

/* ---------- perfiles: navegador con miniaturas e intensidad ---------- */
function hojaPerfiles(){
  const grupos = [...new Set(PERFILES.map(p => p.grupo))];
  abrirHoja(cabHoja('Perfiles') + '<div class="ctls" id="perfil-cant"></div>' + grupos.map(g => '<div class="sub">' + esc(g) + '</div><div class="tira">' +
    PERFILES.filter(p => p.grupo === g).map(p => '<button class="preset" data-perfil="' + p.id + '"><canvas width="148" height="148" data-pmini="' + p.id + '"></canvas><span>' + esc(p.nom) + '</span></button>').join('') + '</div>').join(''));
  const marcar = () => $$('#hoja [data-perfil]').forEach(b => b.classList.toggle('activo', b.dataset.perfil === ED.a.perfil.id));
  const cant = $('#perfil-cant');
  const pintarCant = () => { cant.innerHTML = ''; if (ED.a.perfil.id !== 'color') cant.appendChild(deslizador({ k:'pcant', nom:'Intensidad', min:0, max:200, base:100 }, () => ED.a.perfil.cant, (k, v, f) => { ED.a.perfil.cant = v; cambiar(f); })); };
  pintarCant(); marcar();
  $('#hoja').onclick = e => { const b = e.target.closest('[data-perfil]'); if (b) { ED.a.perfil = { id:b.dataset.perfil, cant:100 }; cambiar(true); marcar(); pintarCant(); if ($('#p-color').dataset.abierta) abrirSub($('#p-color'), $('#p-color').dataset.abierta); } };

/* ---------- muestras de la foto original (selector de balance, rango de color y Quitar) ---------- */
function pixelesFoto(){
  if (!ED.srcPx) { const k = 640 / Math.max(ED.fuente.w, ED.fuente.h); ED.srcPx = Motor.revelar(ED.fuente, ajustesBase(), { ancho:Math.round(ED.fuente.w * k), alto:Math.round(ED.fuente.h * k), antes:true, destino:'pixeles' }); }
  return ED.srcPx;
}
/* Color promedio (0..1) alrededor de un punto de la foto (x, y en 0..1) */
function muestraFoto(x, y, r = 3){
  const p = pixelesFoto(), cx = Math.round(x * (p.width - 1)), cy = Math.round(y * (p.height - 1)), s = [0, 0, 0]; let n = 0;
  for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
    const xx = clamp(cx + i, 0, p.width - 1), yy = clamp(cy + j, 0, p.height - 1), o = (yy * p.width + xx) * 4;
    s[0] += p.data[o]; s[1] += p.data[o + 1]; s[2] += p.data[o + 2]; n++;
  }
  return s.map(v => v / n / 255);
}
/* Temperatura y matiz que vuelven neutro un color (inverso del balance del motor) */
function bbDesdeColor(rgb){
  const [r, g, b] = rgb.map(v => Math.max(.004, Math.pow(v, 2.2)));
  const q = b / r, te = (q - 1) / (.28 * (1 + q)), m = Math.sqrt(r * b) / g, ti = (1 - m) / (.18 + .12 * m);
  return { temperatura:Math.round(clamp(te * 100, -100, 100)), matiz:Math.round(clamp(ti * 100, -100, 100)) };
}
/* Automático: promedio de los medios tonos de toda la foto */
function bbAutomatico(){
  const d = pixelesFoto().data, s = [0, 0, 0]; let n = 0;
  for (let i = 0; i < d.length; i += 16) { const L = (.2126 * d[i] + .7152 * d[i + 1] + .0722 * d[i + 2]) / 255; if (L > .15 && L < .85) { s[0] += d[i]; s[1] += d[i + 1]; s[2] += d[i + 2]; n++; } }
  if (!n) return { temperatura:0, matiz:0 };
  const v = bbDesdeColor(s.map(x => x / n / 255));
  /* como el automático de Lightroom, corrige a medias para no borrar la luz del momento (un atardecer sigue cálido) */
  return { temperatura:Math.round(clamp(v.temperatura * .5, -40, 40)), matiz:Math.round(clamp(v.matiz * .5, -30, 30)) };
}

/* ---------- Auto: tono a partir del histograma de la foto sin ajustes ---------- */
function autoTono(){ Object.assign(ED.a, valoresAuto(ED.fuente, ED.a)); cambiar(true); sincronizarPaneles(); toast('Ajuste automático aplicado'); }
function valoresAuto(fuente, a){
  const px = Motor.revelar(fuente, a, { ancho:160, alto:Math.max(1, Math.round(160 * fuente.h / fuente.w)), antes:true, recorte:{ x:0, y:0, w:1, h:1 }, destino:'pixeles' }).data;
  const L = [];
  for (let i = 0; i < px.length; i += 4) L.push((.2126 * px[i] + .7152 * px[i + 1] + .0722 * px[i + 2]) / 255);
  L.sort((a, b) => a - b);
  const q = p => L[Math.min(L.length - 1, Math.floor(p * L.length))];
  const med = Math.max(.02, q(.5)), ev = clamp(2.2 * Math.log2(.46 / med) * .8, -2.5, 2.5);
  const k = Math.pow(2, ev / 2.2), alto = Math.min(1, q(.995) * k), bajo = q(.005) * k;
  return {
    exposicion:+ev.toFixed(2),
    contraste:Math.round(clamp((.5 - (q(.9) - q(.1))) * 60, -20, 30)),
    altas:Math.round(alto > .93 ? -45 : -15), sombras:Math.round(med < .35 ? 30 : 12),
    blancos:Math.round(clamp((.96 - alto) * 160, -30, 40)), negros:Math.round(clamp((bajo - .03) * -220, -35, 25)),
    intensidad:12, saturacion:4,
  };
}

/* Recortar: proporciones, enderezar, girar 90° y voltear, con el rectángulo de recorte sobre la foto.
   Mientras la pestaña está abierta se ve el marco completo; el recorte se aplica al salir de ella.
   El rectángulo vive en coordenadas 0..1 del marco orientado (tras giros y volteos). */

const PROPORCIONES = [['libre', 'Libre'], ['original', 'Original'], ['1:1', '1:1'], ['4:5', '4:5'], ['5:4', '5:4'], ['2:3', '2:3'], ['3:2', '3:2'], ['9:16', '9:16'], ['16:9', '16:9']];

function construirRecorte(){
  const p = $('#p-recortar');
  p.innerHTML = pcab('Recortar', '<button class="txt" data-reset-recorte>Restablecer</button>') +
    '<div class="chips" id="proporciones">' + PROPORCIONES.map(([k, n]) => '<button data-asp="' + k + '">' + n + '</button>').join('') + '</div><div class="ctls"></div>' +
    '<div class="chips" style="justify-content:center;gap:10px;padding-top:10px">' +
    '<button data-girar>Girar 90°</button><button data-voltear="flipH">Voltear horizontal</button><button data-voltear="flipV">Voltear vertical</button></div>';
  $('.ctls', p).appendChild(deslizador({ k:'angulo', nom:'Enderezar', min:-45, max:45, paso:.1, base:0 }, () => ED.a.geo.angulo,
    (k, v, final) => { ED.a.geo.angulo = v; encajarRecorte(ED.a, ED.fuente.w, ED.fuente.h); cambiar(final); }));
  p.addEventListener('click', e => {
    const g = ED.a.geo, b = e.target.closest('button'); if (!b) return;
    if (b.dataset.asp) { g.aspecto = b.dataset.asp; aplicarProporcion(); }
    else if (b.dataset.girar !== undefined) {
      /* gira 90° a la izquierda y lleva el recorte con la foto */
      g.rot = (g.rot + 3) % 4; Object.assign(g, { x:g.y, y:1 - g.x - g.w, w:g.h, h:g.w, flipH:g.flipV, flipV:g.flipH }); /* girar un volteo horizontal lo vuelve vertical */
      const inv = { '4:5':'5:4', '5:4':'4:5', '2:3':'3:2', '3:2':'2:3', '9:16':'16:9', '16:9':'9:16' }[g.aspecto]; if (inv) g.aspecto = inv;
    }
    else if (b.dataset.voltear) { g[b.dataset.voltear] = !g[b.dataset.voltear]; if (b.dataset.voltear === 'flipH') g.x = 1 - g.x - g.w; else g.y = 1 - g.y - g.h; g.angulo = -g.angulo; }
    else if (b.dataset.resetRecorte !== undefined) Object.assign(g, clonar(GEO_DEF));
    else return;
    encajarRecorte(ED.a, ED.fuente.w, ED.fuente.h); cambiar(true); acomodar(); sincronizarRecorte();
  });
}
function sincronizarRecorte(){ $$('#proporciones button').forEach(b => b.classList.toggle('activo', b.dataset.asp === ED.a.geo.aspecto)); }

/* Proporción buscada en píxeles (ancho / alto) o null si es libre */
function razonRecorte(){
  const g = ED.a.geo, [Wo, Ho] = marcoOrientado(g, ED.fuente.w, ED.fuente.h);
  if (g.aspecto === 'libre') return null;
  if (g.aspecto === 'original') return Wo / Ho;
  const [a, b] = g.aspecto.split(':').map(Number); return a / b;
}
/* El recorte más grande con la proporción elegida, centrado donde estaba */
function aplicarProporcion(){
  const g = ED.a.geo, r = razonRecorte(); if (!r) return;
  const [Wo, Ho] = marcoOrientado(g, ED.fuente.w, ED.fuente.h);
  let w = 1, h = Wo / (r * Ho); if (h > 1) { h = 1; w = r * Ho / Wo; }
  const cx = g.x + g.w / 2, cy = g.y + g.h / 2;
  Object.assign(g, { w, h, x:clamp(cx - w / 2, 0, 1 - w), y:clamp(cy - h / 2, 0, 1 - h) });
}

/* ---------- capa sobre la foto ---------- */
function pintarCapaRecorte(W, H){
  const g = ED.a.geo, x = g.x * W, y = g.y * H, w = g.w * W, h = g.h * H, l = Math.min(22, w / 3, h / 3);
  let s = '<path class="sombra" fill-rule="evenodd" d="M0 0H' + W + 'V' + H + 'H0Z M' + x + ' ' + y + 'h' + w + 'v' + h + 'h' + -w + 'Z"/>';
  for (let i = 1; i < 3; i++) s += '<path class="tercio" d="M' + (x + w * i / 3) + ' ' + y + 'v' + h + 'M' + x + ' ' + (y + h * i / 3) + 'h' + w + '"/>';
  s += '<rect class="rect" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/>';
  s += '<path class="asa" d="M' + x + ' ' + (y + l) + 'V' + y + 'H' + (x + l) + 'M' + (x + w - l) + ' ' + y + 'H' + (x + w) + 'V' + (y + l) +
    'M' + (x + w) + ' ' + (y + h - l) + 'V' + (y + h) + 'H' + (x + w - l) + 'M' + (x + l) + ' ' + (y + h) + 'H' + x + 'V' + (y + h - l) + '"/>';
  return s;
}

/* Arrastre del recorte: esquinas, bordes o mover todo. Devuelve true si tomó el gesto. */
const RC = { modo:null, ini:null, p0:null };
function recorteInicio(nx, ny, W, H){
  const g = ED.a.geo, tol = 28, px = nx * W, py = ny * H;
  const bordes = { l:Math.abs(px - g.x * W) < tol, r:Math.abs(px - (g.x + g.w) * W) < tol, t:Math.abs(py - g.y * H) < tol, b:Math.abs(py - (g.y + g.h) * H) < tol };
  const dentroX = px > g.x * W - tol && px < (g.x + g.w) * W + tol, dentroY = py > g.y * H - tol && py < (g.y + g.h) * H + tol;
  let modo = '';
  if (dentroY) { if (bordes.l) modo += 'l'; else if (bordes.r) modo += 'r'; }
  if (dentroX) { if (bordes.t) modo += 't'; else if (bordes.b) modo += 'b'; }
  if (!modo && px > g.x * W && px < (g.x + g.w) * W && py > g.y * H && py < (g.y + g.h) * H) modo = 'mover';
  /* fuera del recorte: arrastrar en círculo endereza la foto, como en Lightroom */
  if (!modo) modo = 'girar';
  RC.modo = modo; RC.ini = { x:g.x, y:g.y, w:g.w, h:g.h, ang:g.angulo }; RC.p0 = [nx, ny];
  RC.c = [(g.x + g.w / 2) * W, (g.y + g.h / 2) * H]; RC.a0 = Math.atan2(py - RC.c[1], px - RC.c[0]); RC.W = W; RC.H = H;
  return true;
}
function recorteMover(nx, ny){
  const g = ED.a.geo, i = RC.ini, dx = nx - RC.p0[0], dy = ny - RC.p0[1], m = RC.modo, min = .06;
  const antes = { x:g.x, y:g.y, w:g.w, h:g.h };
  if (m === 'girar') {
    const a1 = Math.atan2(ny * RC.H - RC.c[1], nx * RC.W - RC.c[0]);
    let d = (a1 - RC.a0) * 180 / Math.PI; if (d > 180) d -= 360; if (d < -180) d += 360;
    g.angulo = +clamp(i.ang - d, -45, 45).toFixed(1); Object.assign(g, { x:i.x, y:i.y, w:i.w, h:i.h });
    encajarRecorte(ED.a, ED.fuente.w, ED.fuente.h); $$('#p-recortar .ctl').forEach(c => c.sync()); return;
  }
  if (m === 'mover') { g.x = clamp(i.x + dx, 0, 1 - i.w); g.y = clamp(i.y + dy, 0, 1 - i.h); }
  else {
    let x0 = i.x, y0 = i.y, x1 = i.x + i.w, y1 = i.y + i.h;
    if (m.includes('l')) x0 = clamp(x0 + dx, 0, x1 - min); if (m.includes('r')) x1 = clamp(x1 + dx, x0 + min, 1);
    if (m.includes('t')) y0 = clamp(y0 + dy, 0, y1 - min); if (m.includes('b')) y1 = clamp(y1 + dy, y0 + min, 1);
    const r = razonRecorte();
    if (r) {
      /* conserva la proporción: manda el lado que más se movió; el otro crece desde el borde fijo o el centro */
      const [Wo, Ho] = marcoOrientado(g, ED.fuente.w, ED.fuente.h);
      let w = x1 - x0, h = y1 - y0;
      const lateral = m === 'l' || m === 'r', vertical = m === 't' || m === 'b';
      if (lateral || (!vertical && Math.abs(dx) * Wo >= Math.abs(dy) * Ho)) h = w * Wo / (r * Ho); else w = h * r * Ho / Wo;
      if (w > 1) { w = 1; h = w * Wo / (r * Ho); } if (h > 1) { h = 1; w = h * r * Ho / Wo; }
      if (lateral) { const cy = i.y + i.h / 2; y0 = cy - h / 2; } else if (m.includes('t')) y0 = y1 - h;
      if (vertical) { const cx = i.x + i.w / 2; x0 = cx - w / 2; } else if (m.includes('l')) x0 = x1 - w;
      x1 = x0 + w; y1 = y0 + h;
      if (x0 < 0 || y0 < 0 || x1 > 1 || y1 > 1) return;
    }
    Object.assign(g, { x:x0, y:y0, w:x1 - x0, h:y1 - y0 });
  }
  if (!recorteValido(ED.a, ED.fuente.w, ED.fuente.h)) Object.assign(g, antes);
}

/* Máscaras: ajustes locales como en Lightroom. Tipos: degradado lineal, degradado radial, pincel,
   rango de color y rango de luminancia (la selección automática de sujeto o cielo necesita IA y no está).
   Hasta 8 por foto, cada una con su cantidad, invertir y 16 ajustes. Las formas se editan sobre la foto;
   las posiciones se guardan en coordenadas de la foto original, así siguen en su lugar aunque cambie el recorte.
   Aquí vive también el Desenfoque de lente, que usa el mismo óvalo para el área de enfoque. */

const MAX_MASCARAS = 8;
const ICO_M = {
  lineal:'<svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h16"/><path d="M12 5v14" stroke-dasharray="2 2.5"/></svg>',
  radial:'<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/><ellipse cx="12" cy="12" rx="4.5" ry="3" stroke-dasharray="2 2"/></svg>',
  pincel:'<svg viewBox="0 0 24 24"><path d="M14 4l6 6-8 8H6v-6z"/><path d="M4 20h4"/></svg>',
  color:'<svg viewBox="0 0 24 24"><path d="M12 3.5c3 4 6 7 6 10.5a6 6 0 0 1-12 0c0-3.5 3-6.5 6-10.5z"/></svg>',
  luminancia:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="lleno"/></svg>',
  mas:'<svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>',
};
const DESC_M = {
  pincel:'Pinta a mano la zona que quieres ajustar.', lineal:'Un degradado: ideal para cielos o suelos.', radial:'Un óvalo para resaltar o apagar un sujeto.',
  color:'Toca un color de la foto y ajusta todo lo que se le parece.', luminancia:'Elige un rango de brillo: solo las luces o solo las sombras.',
};
/* La máscara que se edita sobre la foto: la elegida, o el área de enfoque en Desenfoque de lente */
const mascaraSel = () => ED.panel === 'desenfoque' ? ED.a.desenfoque : ED.a.mascaras[ED.mascara] || null;
const PINCEL = { tam:20, dureza:50, flujo:100, borrar:false };
/* para los deslizadores: si la máscara ya no existe (se borró o se deshizo), leen una vacía */
const mascaraSegura = () => ED.a.mascaras[ED.mascara] || mascaraBase('radial');

function pintarMascaras(){
  const p = $('#p-mascaras'), ms = ED.a.mascaras, m = ED.a.mascaras[ED.mascara];
  const n = {};
  let h = pcab('Máscaras', ms.length ? '<button class="txt" data-m="ver">' + (ED.verMascara ? 'Ocultar zona' : 'Ver zona') + '</button>' : '') +
    '<div class="lista-m">' + ms.map((x, i) => '<button data-msel="' + i + '" class="' + (i === ED.mascara ? 'activo' : '') + '"><span class="ico">' + ICO_M[x.tipo] + '</span>' +
      TIPOS_MASCARA[x.tipo].corto + ' ' + (n[x.tipo] = (n[x.tipo] || 0) + 1) + '</button>').join('');
  if (ms.length < MAX_MASCARAS) h += '<button data-m="crear"><span class="ico">' + ICO_M.mas + '</span>Crear</button>';
  h += '</div>';
  if (!m) h += '<p class="nota">' + (ms.length ? 'Toca una máscara para editarla o crea otra.' : 'Crea una máscara para ajustar solo una parte de la foto.') + '</p>';
  else {
    h += '<div class="chips"><button data-m="invertir" class="' + (m.invertir ? 'activo' : '') + '">Invertir</button><button data-m="duplicar">Duplicar</button><button data-m="eliminar">Eliminar</button></div>';
    if (m.tipo === 'pincel') h += '<div class="segmento" style="margin:6px 0"><button data-pin="pintar" aria-selected="' + !PINCEL.borrar + '">Pincel</button><button data-pin="borrar" aria-selected="' + PINCEL.borrar + '">Borrar</button></div><div class="ctls" id="m-pincel"></div>' +
      '<p class="nota">Pinta con un dedo sobre la foto. Pellizca con dos para acercar.</p>';
    if (m.tipo === 'color') h += '<div class="fila-color"><span class="muestra" style="background:' + (m.col ? 'rgb(' + m.col.map(v => Math.round(v * 255)).join(',') + ')' : 'transparent') + '"></span>' +
      '<span>' + (m.col ? 'Color elegido' : 'Toca un color en la foto') + '</span><button class="txt" data-m="elegir-color">' + (ED.modoToque === 'color' ? 'Tocando…' : 'Elegir') + '</button></div>';
    h += '<div class="ctls" id="m-forma"></div><div class="sub">Ajustes</div><div class="ctls" id="m-ajustes"></div>';
  }
  p.innerHTML = h;
  if (!m) return;
  const forma = $('#m-forma', p), aj = $('#m-ajustes', p);
  const ctlM = d => deslizador(d, k => mascaraSegura()[k], (k, v, f) => { mascaraSegura()[k] = v; cambiar(f); });
  forma.appendChild(ctlM({ k:'cant', nom:'Cantidad', min:0, max:100, base:100 }));
  if (m.tipo === 'radial') forma.appendChild(ctlM({ k:'desv', nom:'Desvanecer', min:0, max:100, base:50 }));
  if (m.tipo === 'color') forma.appendChild(ctlM({ k:'tol', nom:'Tolerancia', min:1, max:100, base:30 }));
  if (m.tipo === 'luminancia') {
    forma.appendChild(ctlM({ k:'desde', nom:'Desde', min:0, max:100, base:60, riel:'linear-gradient(90deg,#000,#fff)' }));
    forma.appendChild(ctlM({ k:'hasta', nom:'Hasta', min:0, max:100, base:100, riel:'linear-gradient(90deg,#000,#fff)' }));
    forma.appendChild(ctlM({ k:'suav', nom:'Suavidad', min:0, max:100, base:20 }));
  }
  if (m.tipo === 'pincel') {
    const pin = $('#m-pincel', p), ctlP = d => deslizador(d, k => PINCEL[k], (k, v) => { PINCEL[k] = v; });
    pin.appendChild(ctlP({ k:'tam', nom:'Tamaño', min:1, max:100, base:20 })); pin.appendChild(ctlP({ k:'dureza', nom:'Desvanecer', min:0, max:100, base:50 })); pin.appendChild(ctlP({ k:'flujo', nom:'Flujo', min:1, max:100, base:100 }));
  }
  AJ_MASCARA.forEach(d => aj.appendChild(deslizador(d, k => mascaraSegura().a[k], (k, v, f) => { mascaraSegura().a[k] = v; cambiar(f); })));
}

function construirMascaras(){
  $('#p-mascaras').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const ms = ED.a.mascaras, m = ms[ED.mascara];
    if (b.dataset.msel) { ED.mascara = +b.dataset.msel === ED.mascara ? -1 : +b.dataset.msel; ED.modoToque = null; }
    else if (b.dataset.m === 'crear') return hojaCrearMascara();
    else if (b.dataset.m === 'ver') ED.verMascara = !ED.verMascara;
    else if (b.dataset.m === 'invertir') { m.invertir = !m.invertir; cambiar(true); }
    else if (b.dataset.m === 'duplicar' && ms.length < MAX_MASCARAS) { const c = clonar(m); c.id = uid(); ms.push(c); ED.mascara = ms.length - 1; cambiar(true); }
    else if (b.dataset.m === 'eliminar') { ms.splice(ED.mascara, 1); ED.mascara = -1; ED.modoToque = null; cambiar(true); }
    else if (b.dataset.m === 'elegir-color') { ED.modoToque = ED.modoToque === 'color' ? null : 'color'; }
    else if (b.dataset.pin) { PINCEL.borrar = b.dataset.pin === 'borrar'; }
    else return;
    pintarMascaras(); pedirPintura();
  });
}

function hojaCrearMascara(){
  abrirHoja(cabHoja('Crear máscara') + '<div class="grupo">' + Object.keys(TIPOS_MASCARA).map(t =>
    '<button data-nueva="' + t + '"><span class="izq"><span class="ico-f">' + ICO_M[t] + '</span><span>' + TIPOS_MASCARA[t].nom + '<br><small>' + DESC_M[t] + '</small></span></span></button>').join('') + '</div>' +
    '<p class="ayuda">Sujeto, Cielo, Fondo y Personas usan inteligencia artificial de Adobe y no están en Revelado.</p>');
  $('#hoja').onclick = e => {
    const b = e.target.closest('[data-nueva]'); if (!b) return;
    const m = mascaraBase(b.dataset.nueva);
    /* nace en el centro de lo que se ve; la lineal, del borde de arriba hacia la mitad */
    if (m.tipo === 'radial') { const [cx, cy] = salidaASrc(.5, .5); Object.assign(m, { cx, cy }); }
    if (m.tipo === 'lineal') { const [x0, y0] = salidaASrc(.5, .15), [x1, y1] = salidaASrc(.5, .55); Object.assign(m, { x0, y0, x1, y1 }); }
    ED.a.mascaras.push(m); ED.mascara = ED.a.mascaras.length - 1;
    ED.verMascara = ['pincel', 'color', 'luminancia'].includes(m.tipo);
    ED.modoToque = m.tipo === 'color' ? 'color' : null;
    if (m.tipo === 'color') toast('Toca en la foto el color que quieres ajustar', 2400);
    cerrarHoja(); cambiar(true); pintarMascaras();
  };
}

/* Toque en la foto con el selector de color de una máscara */
function elegirColorMascara(x, y){
  const m = ED.a.mascaras[ED.mascara]; if (!m || m.tipo !== 'color') return;
  m.col = muestraFoto(x, y, 2); ED.modoToque = null; cambiar(true); pintarMascaras();
}

/* ---------- pincel: un trazo es una lista de puntos en la foto con radio, dureza y flujo ---------- */
let trazo = null;
function pincelInicio(nx, ny){
  const m = ED.a.mascaras[ED.mascara], [x, y] = salidaASrc(nx, ny);
  trazo = { p:[[+x.toFixed(4), +y.toFixed(4)]], r:.004 + PINCEL.tam / 100 * .12, dureza:PINCEL.dureza < 100 ? 1 - PINCEL.dureza / 100 : .02, flujo:PINCEL.flujo / 100, borrar:PINCEL.borrar };
  m.trazos.push(trazo); ED.cursor = [nx, ny]; pedirPintura();
}
function pincelMover(nx, ny){
  if (!trazo) return;
  const [x, y] = salidaASrc(nx, ny), u = trazo.p[trazo.p.length - 1], [ax, ay] = asp();
  if (Math.hypot((x - u[0]) * ax, (y - u[1]) * ay) > trazo.r * .3) { trazo.p.push([+x.toFixed(4), +y.toFixed(4)]); }
  ED.cursor = [nx, ny]; pedirPintura();
}
function pincelFin(cancelar = false){
  if (!trazo) return;
  if (cancelar) { const m = ED.a.mascaras[ED.mascara]; m.trazos.pop(); }
  trazo = null; ED.cursor = null; cambiar(true);
}

/* ---------- Desenfoque de lente ---------- */

  c.appendChild(deslizador({ k:'desv', nom:'Transición del enfoque', min:0, max:100, base:60 }, k => d()[k], (k, v, f) => { d()[k] = v; cambiar(f); }));
  p.onclick = e => { if (e.target.closest('[data-des-reset]')) { ED.a.desenfoque = Object.assign(clonar(DESENFOQUE_DEF), { cant:0 }); cambiar(true); pintarDesenfoque(); } };
}

/* ---------- capa sobre la foto ---------- */
const asp = () => { const L = Math.max(ED.fuente.w, ED.fuente.h); return [ED.fuente.w / L, ED.fuente.h / L]; };
/* de coordenadas q (foto corregida por proporción) a píxeles de la capa */
function qAPantalla(q, W, H){ const [ax, ay] = asp(), [u, v] = srcASalida(q[0] / ax, q[1] / ay); return [u * W, v * H]; }
const nodo = (p, clase, dato, i) => '<circle class="nodo vivo ' + clase + '" cx="' + p[0] + '" cy="' + p[1] + '" r="' + (clase ? 7 : 10) + '" data-nodo="' + dato + '" data-i="' + i + '"/>';
function elipse(m, W, H, k, clase){
  const [ax, ay] = asp(), c = [m.cx * ax, m.cy * ay], ca = Math.cos(m.ang), sa = Math.sin(m.ang);
  let d = ''; for (let t = 0; t <= 64; t++) { const a = t / 64 * Math.PI * 2, lx = m.rx * k * Math.cos(a), ly = m.ry * k * Math.sin(a); d += (t ? 'L' : 'M') + qAPantalla([c[0] + ca * lx - sa * ly, c[1] + sa * lx + ca * ly], W, H); }
  return '<path class="elipse ' + clase + '" d="' + d + 'Z"/>';
}
function nodosRadial(m, W, H, i){
  const [ax, ay] = asp(), c = [m.cx * ax, m.cy * ay], ca = Math.cos(m.ang), sa = Math.sin(m.ang), pt = (lx, ly) => qAPantalla([c[0] + ca * lx - sa * ly, c[1] + sa * lx + ca * ly], W, H);
  return nodo(qAPantalla(c, W, H), '', 'centro', i) + nodo(pt(m.rx, 0), 'chico', 'rx', i) + nodo(pt(0, -m.ry), 'chico', 'ry', i);
}

function pintarCapaMascaras(W, H){
  if (ED.panel === 'desenfoque') {
    const d = ED.a.desenfoque;
    return elipse(d, W, H, 1 + d.desv / 200, 'int') + elipse(d, W, H, 1, '') + nodosRadial(d, W, H, -1);
  }
  const [ax, ay] = asp(); let s = '<clipPath id="capa-foto"><rect width="' + W + '" height="' + H + '"/></clipPath>';
  ED.a.mascaras.forEach((m, i) => {
    if (m.tipo !== 'lineal' && m.tipo !== 'radial') return;
    const c = m.tipo === 'radial' ? [m.cx * ax, m.cy * ay] : [(m.x0 + m.x1) / 2 * ax, (m.y0 + m.y1) / 2 * ay];
    if (i !== ED.mascara) { s += nodo(qAPantalla(c, W, H), 'chico', 'elegir', i); return; }
    if (m.tipo === 'lineal') {
      const A = [m.x0 * ax, m.y0 * ay], B = [m.x1 * ax, m.y1 * ay], d = [B[0] - A[0], B[1] - A[1]], l = Math.hypot(d[0], d[1]) || 1, nn = [-d[1] / l * 3, d[0] / l * 3];
      const lin = (P, clase) => { const a = qAPantalla([P[0] - nn[0], P[1] - nn[1]], W, H), b = qAPantalla([P[0] + nn[0], P[1] + nn[1]], W, H); return '<path class="linea-m ' + clase + '" d="M' + a + 'L' + b + '"/>'; };
      const pa = qAPantalla(A, W, H), pb = qAPantalla(B, W, H);
      s += '<g clip-path="url(#capa-foto)">' + lin(A, '') + lin(B, 'trazo') + '</g><path class="linea-m trazo" d="M' + pa + 'L' + pb + '"/>' + nodo(pa, '', 'p0', i) + nodo(pb, 'chico', 'p1', i) + nodo(qAPantalla(c, W, H), 'chico', 'centro', i);
    } else s += elipse(m, W, H, 1, '') + elipse(m, W, H, Math.max(.02, 1 - m.desv / 100), 'int') + nodosRadial(m, W, H, i);
  });
  /* cursor del pincel */
  const m = ED.a.mascaras[ED.mascara];
  if (m && m.tipo === 'pincel' && ED.cursor) {
    const [Wo] = marcoOrientado(ED.a.geo, ED.fuente.w, ED.fuente.h), L = Math.max(ED.fuente.w, ED.fuente.h);
    const r = (.004 + PINCEL.tam / 100 * .12) * L * W / (ED.a.geo.w * Wo);
    s += '<circle class="elipse" cx="' + ED.cursor[0] * W + '" cy="' + ED.cursor[1] * H + '" r="' + r + '"/>';
  }
  return s;
}

/* Arrastre de un punto de máscara o del área de enfoque; nx, ny en coordenadas 0..1 de la salida */
const MK = { nodo:null, q0:null, m0:null };
function mascaraInicio(nodoEl, nx, ny){
  const i = +nodoEl.dataset.i;
  if (nodoEl.dataset.nodo === 'elegir') { ED.mascara = i; ED.modoToque = null; pintarMascaras(); pedirPintura(); return; }
  MK.nodo = nodoEl.dataset.nodo; MK.q0 = pantallaAQ(nx, ny); MK.m0 = clonar(mascaraSel());
}
function pantallaAQ(nx, ny){ const [ax, ay] = asp(), [x, y] = salidaASrc(nx, ny); return [x * ax, y * ay]; }
function mascaraMover(nx, ny){
  const m = mascaraSel(); if (!m || !MK.nodo) return;
  const [ax, ay] = asp(), q = pantallaAQ(nx, ny), d = [(q[0] - MK.q0[0]) / ax, (q[1] - MK.q0[1]) / ay], o = MK.m0;
  if (m.tipo === 'lineal') {
    if (MK.nodo === 'p0' || MK.nodo === 'centro') { m.x0 = o.x0 + d[0]; m.y0 = o.y0 + d[1]; }
    if (MK.nodo === 'p1' || MK.nodo === 'centro') { m.x1 = o.x1 + d[0]; m.y1 = o.y1 + d[1]; }
  } else {
    const c = [o.cx * ax, o.cy * ay], v = [q[0] - c[0], q[1] - c[1]];
    if (MK.nodo === 'centro') { m.cx = o.cx + d[0]; m.cy = o.cy + d[1]; }
    if (MK.nodo === 'rx') { m.rx = Math.max(.01, Math.hypot(v[0], v[1])); m.ang = Math.atan2(v[1], v[0]); }
    if (MK.nodo === 'ry') m.ry = Math.max(.01, Math.abs(-Math.sin(m.ang) * v[0] + Math.cos(m.ang) * v[1]));
  }
}
function mascaraFin(){ if (MK.nodo) { MK.nodo = null; cambiar(true); } }

/* Quitar: borra manchas, polvo o detalles pequeños como el pincel corrector de Lightroom.
   Tocar la foto agrega una mancha y la app busca sola una zona parecida para copiar (el círculo punteado);
   se puede arrastrar cualquiera de los dos círculos. Recuperar iguala el color y la luz del entorno;
   Clonar copia tal cual. Las manchas se guardan en coordenadas de la foto original. */

const QUITAR = { modo:'recuperar', tam:25, desv:40, opac:100 };
const MAX_MANCHAS = 64;
const radioMancha = tam => .004 + tam / 100 * .09;   /* fracción del lado mayor de la foto */
const tamMancha = r => Math.round((r - .004) / .09 * 100);
const manchaSel = () => ED.a.manchas[ED.mancha] || null;

function pintarQuitar(){
  const p = $('#p-quitar'), m = manchaSel(), o = m || QUITAR;
  p.innerHTML = pcab('Quitar', ED.a.manchas.length ? '<button class="txt" data-q="todo">Borrar todas</button>' : '') +
    '<div class="segmento" style="margin:4px 0 6px"><button data-q="recuperar" aria-selected="' + (o.modo === 'recuperar') + '">Recuperar</button><button data-q="clonar" aria-selected="' + (o.modo === 'clonar') + '">Clonar</button></div>' +
    '<div class="ctls"></div>' + (m ? '<div class="chips"><button data-q="buscar">Buscar otro origen</button><button data-q="eliminar">Eliminar mancha</button></div>' : '') +
    '<p class="nota">' + (m ? 'Arrastra el círculo punteado para elegir de dónde se copia. Toca en otro lugar para agregar otra mancha.' : 'Toca lo que quieras quitar. Acerca la foto con dos dedos para ser más precisa.') + '</p>';
  const c = $('.ctls', p);
  const fijar = (k, v, f) => {
    QUITAR[k] = v; const s = manchaSel();
    if (s) { if (k === 'tam') s.r = radioMancha(v); else s[k] = v; cambiar(f); }
  };
  c.appendChild(deslizador({ k:'tam', nom:'Tamaño', min:1, max:100, base:25 }, () => manchaSel() ? tamMancha(manchaSel().r) : QUITAR.tam, fijar));
  c.appendChild(deslizador({ k:'desv', nom:'Desvanecer', min:0, max:100, base:40 }, () => (manchaSel() || QUITAR).desv, fijar));
  c.appendChild(deslizador({ k:'opac', nom:'Opacidad', min:1, max:100, base:100 }, () => (manchaSel() || QUITAR).opac, fijar));
}

function construirQuitar(){
  $('#p-quitar').addEventListener('click', e => {
    const b = e.target.closest('[data-q]'); if (!b) return;
    const q = b.dataset.q, m = manchaSel();
    if (q === 'recuperar' || q === 'clonar') { QUITAR.modo = q; if (m) { m.modo = q; cambiar(true); } }
    if (q === 'eliminar' && m) { ED.a.manchas.splice(ED.mancha, 1); ED.mancha = -1; cambiar(true); }
    if (q === 'buscar' && m) { Object.assign(m, buscarOrigen(m.x, m.y, m.r, [m.sx, m.sy])); cambiar(true); }
    if (q === 'todo') { ED.a.manchas = []; ED.mancha = -1; cambiar(true); }
    pintarQuitar(); pedirPintura();
  });
}

/* Toque en la foto: elige una mancha existente o crea una nueva */
function tocarQuitar(nx, ny){
  const [x, y] = salidaASrc(nx, ny);
  if (x < 0 || y < 0 || x > 1 || y > 1) return;
  if (ED.a.manchas.length >= MAX_MANCHAS) return toast('Llegaste al máximo de ' + MAX_MANCHAS + ' manchas en esta foto');
  const r = radioMancha(QUITAR.tam);
  ED.a.manchas.push(Object.assign({ x, y, r, modo:QUITAR.modo, desv:QUITAR.desv, opac:QUITAR.opac }, buscarOrigen(x, y, r)));
  ED.mancha = ED.a.manchas.length - 1; cambiar(true); pintarQuitar();
}

/* Busca alrededor una zona cuyo entorno se parezca al de la mancha (así la copia empata con lo que la rodea) */
function buscarOrigen(x, y, r, evitar = null){
  const px = pixelesFoto(), [ax, ay] = asp(), W = px.width, H = px.height, d = px.data;
  const leer = (u, v) => { const i = (Math.round(clamp(v, 0, 1) * (H - 1)) * W + Math.round(clamp(u, 0, 1) * (W - 1))) * 4; return [d[i], d[i + 1], d[i + 2]]; };
  const anillo = []; for (let k = 0; k < 24; k++) { const a = k / 24 * Math.PI * 2; for (const f of [1.15, 1.5]) anillo.push([Math.cos(a) * r * f / ax, Math.sin(a) * r * f / ay]); }
  const ref = anillo.map(([u, v]) => leer(x + u, y + v));
  let mejor = null, pmejor = Infinity;
  for (const dist of [2.3, 3, 4]) for (let k = 0; k < 16; k++) {
    const a = k / 16 * Math.PI * 2, sx = x + Math.cos(a) * r * dist / ax, sy = y + Math.sin(a) * r * dist / ay;
    if (sx - r / ax < 0 || sy - r / ay < 0 || sx + r / ax > 1 || sy + r / ay > 1) continue;
    if (evitar && Math.hypot((sx - evitar[0]) * ax, (sy - evitar[1]) * ay) < r * .5) continue;
    let p = 0; anillo.forEach(([u, v], i) => { const c = leer(sx + u, sy + v), q = ref[i]; p += Math.abs(c[0] - q[0]) + Math.abs(c[1] - q[1]) + Math.abs(c[2] - q[2]); });
    p *= 1 + dist * .04; /* a igual parecido, mejor cerca */
    if (p < pmejor) { pmejor = p; mejor = { sx, sy }; }
  }
  return mejor || { sx:clamp(x + 2.5 * r / ax, 0, 1), sy:y };
}

/* ---------- capa: círculo de la mancha, círculo punteado del origen y la línea que los une ---------- */
function pintarCapaQuitar(W, H){
  const [Wo] = marcoOrientado(ED.a.geo, ED.fuente.w, ED.fuente.h), L = Math.max(ED.fuente.w, ED.fuente.h), k = L * W / (ED.a.geo.w * Wo);
  let s = '';
  ED.a.manchas.forEach((m, i) => {
    const [u, v] = srcASalida(m.x, m.y), [su, sv] = srcASalida(m.sx, m.sy), r = m.r * k, P = [u * W, v * H], S = [su * W, sv * H];
    if (i !== ED.mancha) { s += '<circle class="elipse vivo" style="stroke-opacity:.55" cx="' + P[0] + '" cy="' + P[1] + '" r="' + r + '" data-mancha="' + i + '" data-cual="d"/>'; return; }
    s += '<path class="linea-m trazo" d="M' + P + 'L' + S + '"/>' +
      '<circle class="elipse int vivo" style="stroke-opacity:1" cx="' + S[0] + '" cy="' + S[1] + '" r="' + r + '" data-mancha="' + i + '" data-cual="s"/>' +
      '<circle class="elipse vivo" style="stroke-width:2.5" cx="' + P[0] + '" cy="' + P[1] + '" r="' + r + '" data-mancha="' + i + '" data-cual="d"/>';
  });
  return s;
}
/* Arrastre de una mancha (d) o de su origen (s) */
const MQ = { i:-1, cual:'', p0:null, m0:null };
function quitarInicio(el, nx, ny){
  MQ.i = +el.dataset.mancha; MQ.cual = el.dataset.cual; MQ.p0 = salidaASrc(nx, ny); MQ.m0 = clonar(ED.a.manchas[MQ.i]);
  if (ED.mancha !== MQ.i) { ED.mancha = MQ.i; pintarQuitar(); }
}
function quitarMover(nx, ny){
  const m = ED.a.manchas[MQ.i]; if (!m) return;
  const [x, y] = salidaASrc(nx, ny), dx = x - MQ.p0[0], dy = y - MQ.p0[1], o = MQ.m0;
  if (MQ.cual === 's') { m.sx = o.sx + dx; m.sy = o.sy + dy; }
  else { m.x = o.x + dx; m.y = o.y + dy; m.sx = o.sx + dx; m.sy = o.sy + dy; }
}
function quitarFin(){ if (MQ.i >= 0) { MQ.i = -1; cambiar(true); } }

/* Presets: los incluidos por grupo y los propios (guardados en el dispositivo), con miniatura de la foto
   abierta y un deslizador de intensidad para el preset elegido (0 a 200 %). Al tocar otro ajuste,
   el preset queda aplicado y se suelta la intensidad. También el dibujo de miniaturas que comparten
   presets y perfiles. */

let PRESETS_PROPIOS = [];
const presetPorClave = clave => {
  const [t, i, j] = clave.split(':');
  return t === 'u' ? PRESETS_PROPIOS.find(p => p.id === i) : PRESETS_INCLUIDOS[+i].lista[+j];
};

/* Dibuja miniaturas cuadradas con la foto abierta; ajustesDe(canvas) dice con qué ajustes. Van de a una
   para no trabar la interfaz, y se cancelan si se piden otras. */
let turnoMinis = 0;
async function pintarMinis(lienzos, ajustesDe){
  const turno = ++turnoMinis, f = ED.fuenteMini; if (!f) return;
  const g = ED.a.geo, [Wo, Ho] = marcoOrientado(g, f.w, f.h), k = 160 / Math.max(g.w * Wo, g.h * Ho);
  const W = Math.max(1, Math.round(g.w * Wo * k)), H = Math.max(1, Math.round(g.h * Ho * k));
  for (const c of lienzos) {
    if (turno !== turnoMinis || !ED.foto) return;
    const a = ajustesDe(c); if (!a) continue;
    const img = imagenACanvas(Motor.revelar(f, a, { ancho:W, alto:H, destino:'pixeles' }));
    const s = Math.min(W, H); c.getContext('2d').drawImage(img, (W - s) / 2, (H - s) / 2, s, s, 0, 0, c.width, c.height);
    await new Promise(r => requestAnimationFrame(r));
  }
}

/* La cabecera (intensidad del preset elegido) se repinta sola; la lista con miniaturas, solo al abrir una foto
   o al crear o borrar un preset propio. */
function pintarPresets(soloCabecera = false){
  const p = $('#p-presets'), sel = ED.preset;
  if (!soloCabecera) {
    const tarjeta = (clave, nom) => '<button class="preset" data-pre="' + clave + '"><canvas width="148" height="148" data-mini="' + clave + '"></canvas><span>' + esc(nom) + '</span></button>';
    let h = '<div id="pre-cab"></div><div class="sub">Mis presets</div><div class="tira">' + PRESETS_PROPIOS.map(x => tarjeta('u:' + x.id, x.nom)).join('') +
      '<button class="preset" data-pre-crear><span class="nuevo">' + ICO_M.mas + '</span><span>Crear</span></button></div>';
    PRESETS_INCLUIDOS.forEach((g, i) => { h += '<div class="sub">' + esc(g.grupo) + '</div><div class="tira">' + g.lista.map((x, j) => tarjeta('i:' + i + ':' + j, x.nom)).join('') + '</div>'; });
    p.innerHTML = h;
    pintarMinis($$('#p-presets canvas[data-mini]'), c => {
      let pr = presetPorClave(c.dataset.mini); if (!pr) return null;
      if (pr.auto) pr = { a:valoresAuto(ED.fuenteMini, ED.a) };
      return ajustesDePreset(ED.a, pr, 1);
    });
  }
  const cab = $('#pre-cab', p); if (!cab) return; /* la lista aún no se ha pintado */
  cab.innerHTML = pcab('Presets', sel ? '<button class="txt" data-pre-quitar>Quitar</button>' : '') +
    (sel ? '<div class="ctls"></div>' + (sel.clave.startsWith('u:') ? '<div class="chips"><button data-pre-borrar>Eliminar este preset</button></div>' : '') : '');
  if (sel) $('.ctls', cab).appendChild(deslizador({ k:'cant', nom:'Intensidad', min:0, max:200, base:100 }, () => ED.preset.cant,
    (k, v, final) => { ED.preset.cant = v; ED.a = ajustesDePreset(ED.preset.base, ED.preset.p, v / 100); cambiar(final, true); }));
  $$('.preset[data-pre]', p).forEach(b => b.classList.toggle('activo', !!sel && b.dataset.pre === sel.clave));
}

function construirPresets(){
  $('#p-presets').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.pre) {
      if (ED.preset && ED.preset.clave === b.dataset.pre) return;
      let p = presetPorClave(b.dataset.pre); if (!p) return;
      const base = ED.preset ? ED.preset.base : clonar(ED.a);
      if (p.auto) p = { nom:'Auto', a:valoresAuto(ED.fuente, base) };
      ED.preset = { clave:b.dataset.pre, p, cant:100, base };
      ED.a = ajustesDePreset(base, p, 1); cambiar(true, true); refrescarTodo(false);
    }
    else if (b.dataset.preQuitar !== undefined) { ED.a = clonar(ED.preset.base); ED.preset = null; cambiar(true); refrescarTodo(false); }
    else if (b.dataset.preCrear !== undefined) crearPreset();
    else if (b.dataset.preBorrar !== undefined) {
      const id = ED.preset.clave.slice(2), pr = PRESETS_PROPIOS.find(x => x.id === id);
      if (!pr || !(await confirmar('Eliminar preset', 'Se borra «' + pr.nom + '». Las fotos que ya lo usan no cambian.', 'peligro'))) return;
      await DB.eliminarPreset(id); PRESETS_PROPIOS = PRESETS_PROPIOS.filter(x => x.id !== id); ED.preset = null; sincronizarPaneles(); pintarPresets(); toast('Preset eliminado');
    }
  });
}

/* Guarda los ajustes actuales como preset propio, eligiendo qué grupos incluye (como en Lightroom) */
function crearPreset(){
  const grupos = GRUPOS_COPIA.filter(g => !['recorte', 'manchas', 'mascaras', 'geometria', 'optica'].includes(g.k));
  abrirHoja(cabHoja('Crear preset') +
    '<form id="f-preset"><div class="grupo"><input type="text" id="preset-nombre" maxlength="40" placeholder="Nombre del preset" autofocus autocomplete="off"></div>' +
    '<div class="sub">Incluir</div><div class="grupo">' + grupos.map(g => '<label class="marca"><span>' + g.nom + '</span><input type="checkbox" value="' + g.k + '" checked></label>').join('') + '</div>' +
    '<button class="btn primario bloque" type="submit">Guardar preset</button></form>');
  $('#f-preset').onsubmit = async e => {
    e.preventDefault();
    const nom = $('#preset-nombre').value.trim() || 'Mi preset ' + (PRESETS_PROPIOS.length + 1);
    const incl = $$('#f-preset input[type=checkbox]:checked').map(c => c.value), a = {};
    const claves = incl.flatMap(g => CLAVES[g] || []);
    for (const k of claves) if (ED.a[k] !== DEF[k]) a[k] = ED.a[k];
    const pr = { id:uid(), nom, a, fecha:Date.now() };
    if (incl.includes('curva')) pr.curva = clonar(ED.a.curva);
    if (incl.includes('perfil') && ED.a.perfil.id !== 'color') pr.perfil = ED.a.perfil.id;
    await DB.guardarPreset(pr); PRESETS_PROPIOS.push(pr); cerrarHoja(); pintarPresets(); toast('Preset guardado');
  };
}

/* Editor: abre una foto, la pinta con el motor, guarda el historial (deshacer y rehacer) y la edición en el
   dispositivo, y maneja los gestos sobre la foto como Lightroom:
   - mantener un dedo: ver el original; pellizcar o doble toque: acercar; arrastrar con zoom: moverse
   - deslizar a los lados: otra foto; desde el borde izquierdo: volver a la biblioteca
   - tocar con dos dedos: alterna la información superpuesta (nada, histograma, datos de la cámara)
   - tocar la foto con el selector activo (balance de blancos, rango de color) o en Quitar para agregar manchas
   También el menú de más opciones, Antes y después dividido, avisos de recorte, copiar y pegar por grupos
   y las versiones. */

const ED = {
  foto:null, a:ajustesBase(), img:null, fuente:null, fuenteMini:null, srcPx:null, inicial:null,
  panel:'presets', hist:[], hi:0, sucio:false, preset:null, autoPrevio:null,
  antes:false, zoom:1, px:0, py:0, vista:{ x:0, y:0, w:1, h:1 }, res:{ w:1, h:1 },
  mascara:-1, verMascara:false, mancha:-1, modoToque:null, cursor:null,
  division:null, avisos:false, avisosTemp:false, info:0,
};
const RECORTE_TODO = { x:0, y:0, w:1, h:1 };
const modoRecorte = () => ED.panel === 'recortar';
try { ED.info = +localStorage.getItem('revelado.info') || 0; } catch (_) {}

/* ---------- abrir y cerrar ---------- */
async function abrirEditor(id){
  const foto = BIB.fotos.find(f => f.id === id); if (!foto) return;
  if (ED.foto) await soltarFoto(); else navPush('editor'); /* el gesto de atrás del sistema vuelve a la biblioteca */
  $('#v-biblioteca').hidden = true; $('#v-editor').hidden = false;
  try {
    const img = await decodificar(await DB.original(id));
    ED.foto = foto; ED.img = img;
    ED.fuente = Motor.fuente(img, esComputador() ? 3072 : 2048); ED.fuenteMini = Motor.fuente(img, 200);
  } catch (e) { console.error(e); toast('No se pudo abrir la foto'); return volverBiblioteca(); }
  foto.versiones = foto.versiones || [];
  ED.a = completarAjustes(foto.ajustes); ED.inicial = JSON.stringify(ED.a); ED.hist = [ED.inicial]; ED.hi = 0; ED.sucio = false;
  Object.assign(ED, { preset:null, autoPrevio:null, mascara:-1, verMascara:false, mancha:-1, modoToque:null, antes:false, zoom:1, px:0, py:0, srcPx:null, division:null });
  $$('.pane').forEach(p => { if (p.dataset.abierta) cerrarSub(p); });
  botonesHistorial(); refrescarTodo(true); pintarPresets(); mostrarInfo();
}

/* Guarda lo pendiente, rehace la miniatura si hubo cambios y libera la memoria de la foto */
async function soltarFoto(){
  const f = ED.foto; if (!f) return;
  clearTimeout(guardadoT);
  if (ED.sucio) {
    f.ajustes = clonar(ED.a); f.editada = ajustesEditados(f.ajustes);
    try { f.mini = await miniatura(f, ED.img); } catch (_) {}
    await DB.guardar(f);
  }

/* ---------- geometría de la vista ---------- */
function acomodar(){
  if (!ED.fuente) return;
  const g = ED.a.geo, [Wo, Ho] = marcoOrientado(g, ED.fuente.w, ED.fuente.h);
  const fw = modoRecorte() ? Wo : g.w * Wo, fh = modoRecorte() ? Ho : g.h * Ho;
  const E = $('#escena').getBoundingClientRect(), pad = esComputador() ? 28 : modoRecorte() ? 22 : 10;
  const s = Math.min((E.width - 2 * pad) / fw, (E.height - 2 * pad) / fh), w = fw * s, h = fh * s;
  ED.vista = { x:(E.width - w) / 2, y:(E.height - h) / 2, w, h };
  const k = Math.min(1, 2048 / Math.max(fw, fh)); ED.res = { w:Math.max(1, Math.round(fw * k)), h:Math.max(1, Math.round(fh * k)) };
  const m = $('#marco'); m.style.width = w + 'px'; m.style.height = h + 'px';
  $('#capa').setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  limitarPaneo(); aplicarTransformacion(); pedirPintura();
}
function aplicarTransformacion(){ $('#marco').style.transform = 'translate(' + (ED.vista.x + ED.px) + 'px,' + (ED.vista.y + ED.py) + 'px) scale(' + ED.zoom + ')'; }
function limitarPaneo(){
  const E = $('#escena').getBoundingClientRect(), v = ED.vista, z = ED.zoom;
  const eje = (ancho, inicio, total, actual) => { const s = ancho * z; return s <= total ? (total - s) / 2 - inicio : clamp(actual, total - s - inicio, -inicio); };
  ED.px = eje(v.w, v.x, E.width, ED.px); ED.py = eje(v.h, v.y, E.height, ED.py);
}
const zoom100 = () => ED.res.w / (ED.vista.w * (window.devicePixelRatio || 1));
let zoomT;
function mostrarZoom(){ const e = $('#etq-zoom'); e.textContent = Math.round(ED.zoom / zoom100() * 100) + ' %'; e.classList.add('ver'); clearTimeout(zoomT); zoomT = setTimeout(() => e.classList.remove('ver'), 900); }
/* Acerca o aleja manteniendo fijo el punto de la pantalla (cx, cy relativos a la escena) */
function zoomEn(z, cx, cy){
  const zmax = Math.max(4, zoom100() * 2), z0 = ED.zoom; z = clamp(z, 1, zmax);
  const bx = (cx - ED.vista.x - ED.px) / z0, by = (cy - ED.vista.y - ED.py) / z0;
  ED.zoom = z; ED.px = cx - ED.vista.x - bx * z; ED.py = cy - ED.vista.y - by * z;
  limitarPaneo(); aplicarTransformacion(); mostrarZoom(); pedirPintura();
}
/* Conversión entre la salida (0..1 de lo que se ve) y la foto original (0..1), con toda la geometría */
let cadenaCache = { k:'', g:null };
function cadenaActual(){
  const k = JSON.stringify([ED.a.geo, CLAVES.geometria.map(c => ED.a[c]), modoRecorte(), ED.fuente.w, ED.fuente.h]);
  if (k !== cadenaCache.k) cadenaCache = { k, g:cadenaGeo(ED.a, ED.fuente.w, ED.fuente.h, modoRecorte() ? RECORTE_TODO : ED.a.geo) };
  return cadenaCache.g;
}
const salidaASrc = (u, v) => cadenaActual().ida(u, v);
const srcASalida = (x, y) => cadenaActual().vuelta(x, y);

/* ---------- pintura ---------- */
let pinturaPedida = false, histoT;
function pedirPintura(){ if (!pinturaPedida) { pinturaPedida = true; requestAnimationFrame(pintar); } }
function pintar(){
  pinturaPedida = false; if (!ED.fuente) return;
  const pinta = ED.panel === 'mascaras' && ED.a.mascaras[ED.mascara] && ED.a.mascaras[ED.mascara].tipo === 'pincel' && ED.cursor;
  Motor.revelar(ED.fuente, ED.a, { ancho:ED.res.w, alto:ED.res.h, antes:ED.antes, recorte:modoRecorte() ? RECORTE_TODO : null,
    verMascara:ED.panel === 'mascaras' && (ED.verMascara || pinta) ? ED.mascara : -1,
    division:ED.division, avisos:ED.avisos || ED.avisosTemp });
  const W = ED.vista.w, H = ED.vista.h;
  let capa = '';
  if (!ED.antes) {
    if (modoRecorte()) capa = pintarCapaRecorte(W, H);
    else if (ED.panel === 'mascaras' || ED.panel === 'desenfoque') capa = pintarCapaMascaras(W, H);
    else if (ED.panel === 'quitar') capa = pintarCapaQuitar(W, H);
    if (ED.division != null && !modoRecorte()) { const x = ED.division * W; capa += '<path class="division" d="M' + x + ' 0V' + H + '"/><circle class="nodo vivo" cx="' + x + '" cy="' + H / 2 + '" r="11" data-division="1"/>'; }
  }

  if (ED.info === 1) { clearTimeout(histoT); histoT = setTimeout(pintarHistograma, 120); }
}
function pintarHistograma(){
  if (!ED.fuente) return;
  const k = 200 / Math.max(ED.res.w, ED.res.h), d = Motor.revelar(ED.fuente, ED.a, { ancho:Math.max(1, Math.round(ED.res.w * k)), alto:Math.max(1, Math.round(ED.res.h * k)), antes:ED.antes, destino:'pixeles' }).data;
  const R = new Uint32Array(64), G = new Uint32Array(64), B = new Uint32Array(64);
  for (let i = 0; i < d.length; i += 4) { R[d[i] >> 2]++; G[d[i + 1] >> 2]++; B[d[i + 2] >> 2]++; }
  let m = 1; for (let i = 1; i < 63; i++) m = Math.max(m, R[i], G[i], B[i]);
  const c = $('#histo'), x = c.getContext('2d'), W = c.width, H = c.height, bw = W / 64;
  x.clearRect(0, 0, W, H); x.globalCompositeOperation = 'lighter';
  [[R, 'rgba(255,69,58,.75)'], [G, 'rgba(48,209,88,.75)'], [B, 'rgba(10,132,255,.8)']].forEach(([a, col]) => {
    x.fillStyle = col; x.beginPath(); x.moveTo(0, H);
    for (let i = 0; i < 64; i++) x.lineTo(i * bw + bw / 2, H - Math.min(1, a[i] / m) * (H - 4));
    x.lineTo(W, H); x.closePath(); x.fill();
  });
  x.globalCompositeOperation = 'source-over';
}
/* Información superpuesta: 0 nada, 1 histograma, 2 datos de la cámara */

/* ---------- gestos sobre la foto ---------- */
(() => {
  const PT = new Map(); let gesto = null, retener, ultimoToque = 0, ini = null, dosDedos = null;
  const escena = () => $('#escena');
  const rel = e => { const r = escena().getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const norm = e => { const r = $('#marco').getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
  const finAntes = () => { if (ED.antes) { ED.antes = false; pedirPintura(); } };

  document.addEventListener('pointerdown', e => {
    if (!escena().contains(e.target) || !ED.fuente || e.button) return;
    escena().setPointerCapture(e.pointerId);
    PT.set(e.pointerId, rel(e));
    if (PT.size === 1) {
      const [nx, ny] = norm(e), p = ED.panel;
      ini = { p:rel(e), t:Date.now(), px:ED.px, py:ED.py };
      if (e.clientX < 24) { gesto = 'nada'; return; } /* el borde izquierdo es del gesto de atrás */
      if (e.target.closest('[data-division]')) { gesto = 'division'; return; }
      if (modoRecorte() && recorteInicio(nx, ny, ED.vista.w, ED.vista.h)) { gesto = 'recorte'; return; }
      const n = (p === 'mascaras' || p === 'desenfoque') && e.target.closest('[data-nodo]');
      if (n) { mascaraInicio(n, nx, ny); gesto = n.dataset.nodo === 'elegir' ? 'nada' : 'mascara'; return; }
      const mq = p === 'quitar' && e.target.closest('[data-mancha]');
      if (mq) { quitarInicio(mq, nx, ny); gesto = 'mancha'; pedirPintura(); return; }
      const m = ED.a.mascaras[ED.mascara];
      if (p === 'mascaras' && m && m.tipo === 'pincel' && !ED.modoToque) { pincelInicio(nx, ny); gesto = 'pintar'; return; }
      gesto = 'toque';
      retener = setTimeout(() => { if (gesto === 'toque') { gesto = 'antes'; ED.antes = true; pedirPintura(); } }, 260);
    } else if (PT.size === 2 && !modoRecorte() && !['mascara', 'recorte', 'mancha', 'division'].includes(gesto)) {
      clearTimeout(retener); finAntes();
      if (gesto === 'pintar') pincelFin(true);
      const [a, b] = [...PT.values()];
      gesto = 'pellizco'; ini = { d:Math.hypot(a[0] - b[0], a[1] - b[1]), z:ED.zoom }; dosDedos = { t:Date.now(), z:ED.zoom, movio:false };
    }
  });
  document.addEventListener('pointermove', e => {
    if (!PT.has(e.pointerId)) return;
    PT.set(e.pointerId, rel(e));
    const [x, y] = rel(e), [nx, ny] = norm(e);
    if (gesto === 'division') { ED.division = clamp(nx, .02, .98); pedirPintura(); return; }
    if (gesto === 'recorte') { recorteMover(nx, ny); pedirPintura(); return; }
    if (gesto === 'mascara') { mascaraMover(nx, ny); pedirPintura(); return; }
    if (gesto === 'mancha') { quitarMover(nx, ny); pedirPintura(); return; }
    if (gesto === 'pintar') { pincelMover(nx, ny); return; }
    if (gesto === 'toque' && Math.hypot(x - ini.p[0], y - ini.p[1]) > 8) {
      clearTimeout(retener);
      gesto = ED.zoom > 1.01 ? 'paneo' : ['recortar', 'mascaras', 'quitar', 'desenfoque'].includes(ED.panel) ? 'nada' : 'barrido';
    }
    if (gesto === 'paneo') { ED.px = ini.px + x - ini.p[0]; ED.py = ini.py + y - ini.p[1]; limitarPaneo(); aplicarTransformacion(); }
    if (gesto === 'barrido') { $('#marco').style.transform = 'translate(' + (ED.vista.x + (x - ini.p[0]) * .35) + 'px,' + ED.vista.y + 'px)'; }
    if (gesto === 'pellizco' && PT.size === 2) {
      const [a, b] = [...PT.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (Math.abs(d - ini.d) > 12) dosDedos.movio = true;
      if (dosDedos.movio) zoomEn(ini.z * d / ini.d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    }
  });
  const soltar = e => {
    if (!PT.has(e.pointerId)) return;
    const [x, y] = rel(e), [nx, ny] = norm(e); PT.delete(e.pointerId); clearTimeout(retener);
    if (gesto === 'division') { gesto = null; return; }
    if (gesto === 'recorte') { gesto = null; cambiar(true); return; }
    if (gesto === 'mascara') { gesto = null; mascaraFin(); return; }
    if (gesto === 'mancha') { gesto = null; quitarFin(); return; }
    if (gesto === 'pintar') { gesto = null; pincelFin(); return; }
    if (gesto === 'antes') { gesto = null; finAntes(); return; }
    if (gesto === 'toque' && e.type === 'pointerup') {
      if (tocarFoto(nx, ny)) { gesto = null; return; }
      const ahora = Date.now();
      if (ahora - ultimoToque < 300 && !['recortar', 'mascaras', 'desenfoque'].includes(ED.panel)) {
        ultimoToque = 0;
        if (ED.zoom > 1.01) { ED.zoom = 1; ED.px = ED.py = 0; limitarPaneo(); aplicarTransformacion(); mostrarZoom(); }
        else zoomEn(Math.max(zoom100(), 2.5), x, y);
      } else ultimoToque = ahora;
    }
    if (gesto === 'barrido') {
      const dx = x - ini.p[0], dy = y - ini.p[1];
      aplicarTransformacion();
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) navegar(dx < 0 ? 1 : -1);
    }
    if (gesto === 'pellizco') {
      if (dosDedos && !dosDedos.movio && Date.now() - dosDedos.t < 350) { dosDedos = null; gesto = PT.size ? 'nada' : null; alternarInfo(); return; }
      if (PT.size === 1) { const p = [...PT.values()][0]; gesto = 'paneo'; ini = { p, px:ED.px, py:ED.py }; return; }
      if (ED.zoom < 1.03) { ED.zoom = 1; limitarPaneo(); aplicarTransformacion(); }
    }
    if (!PT.size) gesto = null;
  };
  document.addEventListener('pointerup', soltar); document.addEventListener('pointercancel', soltar);
  /* cursor del pincel al pasar el ratón en computador */
  document.addEventListener('pointermove', e => {
    if (PT.size || e.pointerType !== 'mouse' || !escena().contains(e.target) || ED.panel !== 'mascaras') return;
    const m = ED.a.mascaras[ED.mascara]; if (!m || m.tipo !== 'pincel') return;
    ED.cursor = norm(e); pedirPintura();
  });
  /* rueda o pellizco del trackpad en computador */
  document.addEventListener('wheel', e => {
    if (!escena().contains(e.target) || !ED.fuente || modoRecorte()) return;
    e.preventDefault(); const [x, y] = rel(e); zoomEn(ED.zoom * Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .002)), x, y);
  }, { passive:false });
  document.addEventListener('contextmenu', e => { if (escena().contains(e.target)) e.preventDefault(); });
})();

/* Exportar: revela a tamaño real con el mismo motor de la vista previa. Opciones como en Lightroom:
   formato (JPG o PNG), tamaño (máximo, 2048 o 1080 px por el lado mayor), calidad, marca de agua y
   nombre del archivo. Funciona con una foto (desde el editor) o con varias (desde Seleccionar).
   En el iPhone entrega por la hoja de compartir ("Guardar imagen" las manda a Fotos); en computador, o si
   compartir no está disponible, las descarga. Las fotos se preparan antes de mostrar el botón de compartir
   para que Safari lo acepte como un toque directo. */

const EXP = { formato:'jpg', tam:'max', calidad:92, nombre:'original', marca:{ activa:false, texto:'', tam:4, opac:70, pos:'abajo-der' }, listos:[], url:'' };
try { Object.assign(EXP, JSON.parse(localStorage.getItem('revelado.exportar') || '{}'), { listos:[], url:'' }); } catch (_) {}
const guardarOpcionesExp = () => { try { const { listos, url, ...o } = EXP; localStorage.setItem('revelado.exportar', JSON.stringify(o)); } catch (_) {} };
const LADO_MAX = () => Math.min(Motor.maxLado, esComputador() ? 6000 : 4096);
const POSICIONES = [['arriba-izq', 'Arriba izquierda'], ['arriba-der', 'Arriba derecha'], ['centro', 'Centro'], ['abajo-izq', 'Abajo izquierda'], ['abajo-der', 'Abajo derecha']];

let fotosExp = [];
function hojaExportar(fotos = null){
  fotosExp = fotos || [ED.foto];
  const una = fotosExp.length === 1, seg = (clave, opciones) => '<div class="segmento" role="tablist" style="margin:6px 0 12px">' + opciones.map(([v, n]) =>
    '<button data-exp="' + clave + ':' + v + '" aria-selected="' + (String(EXP[clave]) === v) + '">' + n + '</button>').join('') + '</div>';
  abrirHoja(cabHoja(una ? 'Exportar' : 'Exportar ' + fotosExp.length + ' fotos') +
    '<div class="sub">Formato</div>' + seg('formato', [['jpg', 'JPG'], ['png', 'PNG']]) +
    '<div class="sub">Tamaño (lado mayor)</div>' + seg('tam', [['max', 'Máximo'], ['2048', '2048 px'], ['1080', '1080 px']]) +
    '<div id="exp-calidad"></div>' +
    '<div class="sub">Nombre del archivo</div>' + seg('nombre', [['original', 'Original'], ['fecha', 'Fecha y número']]) +
    '<div class="grupo"><label class="marca"><span>Marca de agua</span><input type="checkbox" id="exp-marca"' + (EXP.marca.activa ? ' checked' : '') + '></label></div>' +
    '<div id="exp-marca-op"' + (EXP.marca.activa ? '' : ' hidden') + '><div class="grupo"><input type="text" id="exp-marca-texto" maxlength="60" placeholder="© Tu nombre" value="' + esc(EXP.marca.texto) + '" autocomplete="off"></div>' +
      '<div class="chips" id="exp-pos">' + POSICIONES.map(([k, n]) => '<button data-pos="' + k + '" class="' + (EXP.marca.pos === k ? 'activo' : '') + '">' + n + '</button>').join('') + '</div><div id="exp-marca-ctl"></div></div>' +
    '<div id="exp-vista"></div>' +
    '<button class="btn primario bloque" id="b-compartir" disabled>Preparando…</button>',
    () => { if (EXP.url) URL.revokeObjectURL(EXP.url); EXP.url = ''; EXP.listos = []; turnoExp++; });
  const cal = $('#exp-calidad');
  if (EXP.formato === 'jpg') cal.appendChild(deslizador({ k:'calidad', nom:'Calidad', min:40, max:100, base:92 }, () => EXP.calidad, (k, v, f) => { EXP.calidad = v; if (f) cambioExp(); }));
  const mc = $('#exp-marca-ctl');
  mc.appendChild(deslizador({ k:'tam', nom:'Tamaño', min:1, max:15, base:4 }, () => EXP.marca.tam, (k, v, f) => { EXP.marca.tam = v; if (f) cambioExp(); }));
  mc.appendChild(deslizador({ k:'opac', nom:'Opacidad', min:10, max:100, base:70 }, () => EXP.marca.opac, (k, v, f) => { EXP.marca.opac = v; if (f) cambioExp(); }));
  $('#hoja').onclick = e => {
    const b = e.target.closest('[data-exp]'), p = e.target.closest('[data-pos]');
    if (b) { const [k, v] = b.dataset.exp.split(':'); if (String(EXP[k]) === v) return; EXP[k] = v; guardarOpcionesExp(); return hojaExportar(fotosExp); }
    if (p) { EXP.marca.pos = p.dataset.pos; $$('#exp-pos button').forEach(x => x.classList.toggle('activo', x === p)); cambioExp(); }
  };
  $('#exp-marca').onchange = e => { EXP.marca.activa = e.target.checked; $('#exp-marca-op').hidden = !EXP.marca.activa; cambioExp(); };
  $('#exp-marca-texto').onchange = e => { EXP.marca.texto = e.target.value; cambioExp(); };
  $('#b-compartir').onclick = entregar;
  if (una) prepararExportacion(); else { $('#b-compartir').disabled = false; $('#b-compartir').textContent = 'Preparar ' + fotosExp.length + ' fotos'; }
}
function cambioExp(){ guardarOpcionesExp(); EXP.listos = []; if (fotosExp.length === 1) prepararExportacion(); else { $('#b-compartir').textContent = 'Preparar ' + fotosExp.length + ' fotos'; $('#b-compartir').disabled = false; } }

/* Revela una foto a tamaño de exportación y la devuelve como archivo */
async function revelarParaExportar(foto, img, ajustes, n){
  const f = Motor.fuente(img, LADO_MAX());
  try {
    const g = ajustes.geo, [Wo, Ho] = marcoOrientado(g, f.w, f.h), lado = EXP.tam === 'max' ? Infinity : +EXP.tam;
    const k = Math.min(1, lado / Math.max(g.w * Wo, g.h * Ho));
    const W = Math.max(1, Math.round(g.w * Wo * k)), H = Math.max(1, Math.round(g.h * Ho * k));
    const c = imagenACanvas(Motor.revelar(f, ajustes, { ancho:W, alto:H, destino:'pixeles' }));
    if (EXP.marca.activa && EXP.marca.texto.trim()) dibujarMarca(c);
    const tipo = EXP.formato === 'png' ? 'image/png' : 'image/jpeg';
    const blob = await aBlob(c, tipo, EXP.calidad / 100);
    const base = EXP.nombre === 'fecha' ? 'Revelado ' + new Date().toISOString().slice(0, 10) + ' ' + String(n + 1).padStart(3, '0') : (foto.nombre || 'Revelado').replace(/[\\/:*?"<>|]/g, '') + ' revelada';
    return { archivo:new File([blob], base + '.' + EXP.formato, { type:tipo }), W, H, blob };
  } finally { f.liberar(); }
}
/* Marca de agua de texto con una sombra suave para que se lea sobre cualquier fondo */
function dibujarMarca(c){
  const x = c.getContext('2d'), m = EXP.marca, t = Math.max(10, Math.round(Math.max(c.width, c.height) * m.tam / 100 * .6)), pad = t * .9;
  x.font = '600 ' + t + 'px -apple-system,"Helvetica Neue",Arial,sans-serif'; x.globalAlpha = m.opac / 100;
  x.fillStyle = '#fff'; x.shadowColor = 'rgba(0,0,0,.45)'; x.shadowBlur = t * .25;
  const izq = m.pos.endsWith('izq'), der = m.pos.endsWith('der');
  x.textAlign = izq ? 'left' : der ? 'right' : 'center'; x.textBaseline = m.pos.startsWith('arriba') ? 'top' : m.pos === 'centro' ? 'middle' : 'bottom';
  x.fillText(m.texto.trim(), izq ? pad : der ? c.width - pad : c.width / 2, m.pos.startsWith('arriba') ? pad : m.pos === 'centro' ? c.height / 2 : c.height - pad);
  x.globalAlpha = 1; x.shadowBlur = 0;
}

let turnoExp = 0;
async function prepararExportacion(){
  const turno = ++turnoExp, boton = $('#b-compartir'); if (!boton) return;
  boton.disabled = true; boton.textContent = 'Preparando…';
  $('#exp-vista').innerHTML = fotosExp.length === 1 ? '<p class="ayuda">Preparando la foto…</p>' : '';
  await esperar(60); /* deja pintar la hoja antes del trabajo pesado */
  if (turno !== turnoExp) return;
  try {
    const listos = [];
    for (let i = 0; i < fotosExp.length; i++) {
      const f = fotosExp[i];
      if (fotosExp.length > 1) boton.textContent = 'Preparando ' + (i + 1) + ' de ' + fotosExp.length + '…';
      const enEditor = ED.foto && ED.foto.id === f.id, img = enEditor ? ED.img : await decodificar(await DB.original(f.id));
      listos.push(await revelarParaExportar(f, img, enEditor ? ED.a : completarAjustes(f.ajustes), i));
      if (!enEditor && img.close) img.close();
      if (turno !== turnoExp) return;
    }
    EXP.listos = listos;
    if (listos.length === 1) {
      const r = listos[0]; if (EXP.url) URL.revokeObjectURL(EXP.url); EXP.url = URL.createObjectURL(r.blob);
      $('#exp-vista').innerHTML = '<img class="vista-exp" src="' + EXP.url + '" alt="Vista de la foto exportada"><p class="ayuda num">' + r.W + ' × ' + r.H + ' px · ' + (r.blob.size / 1048576).toFixed(1) + ' MB</p>';
    }
    boton.disabled = false;
    boton.textContent = esComputador() ? (listos.length > 1 ? 'Descargar ' + listos.length + ' fotos' : 'Descargar') : (listos.length > 1 ? 'Compartir ' + listos.length + ' fotos' : 'Compartir o guardar en Fotos');
  } catch (e) {
    console.error(e); $('#exp-vista').innerHTML = '<p class="ayuda">No se pudo preparar. Prueba con un tamaño menor.</p>'; boton.textContent = 'Reintentar'; boton.disabled = false;
  }
}

async function entregar(){
  if (!EXP.listos.length) return prepararExportacion();
  const archivos = EXP.listos.map(r => r.archivo);
  if (!esComputador() && navigator.canShare && navigator.canShare({ files:archivos })) {
    try { await navigator.share({ files:archivos }); cerrarHoja(); if (BIB.seleccionando) salirSeleccion(); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  let ok = true; for (const a of archivos) ok = (await guardarArchivo(a)) && ok;
  if (ok) { cerrarHoja(); if (BIB.seleccionando) salirSeleccion(); toast(archivos.length > 1 ? archivos.length + ' fotos exportadas' : 'Foto exportada'); return; }
  const ay = $('#exp-vista .ayuda'); if (ay) ay.textContent = 'Mantén presionada la imagen y elige «Guardar en Fotos».';
}

/* Descarga el archivo. Dentro de Claude usa el permiso de descargas de la página; si no, un enlace */
async function guardarArchivo(archivo){
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename:archivo.name, data:archivo }); return true; }
  } catch (e) { if (e && e.code === 'declined') return false; }
  try {
    const url = URL.createObjectURL(archivo), en = document.createElement('a');
    en.href = url; en.download = archivo.name; document.body.appendChild(en); en.click(); en.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); return true;
  } catch (_) { return false; }
}

/* Gestos del celular, con los mismos estándares de Caudal:
   - sin zoom accidental de la página (pellizco y doble toque); el pellizco solo acerca la foto en el editor
   - el gesto de atrás del sistema (o el botón atrás del navegador) cierra la hoja abierta o vuelve a la biblioteca
   - en la app instalada, deslizar desde el borde izquierdo vuelve a la biblioteca, porque iOS no trae ese gesto */

const esInstalada = () => navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

/* ---------- sin zoom de la página ---------- */
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive:false }));
document.addEventListener('touchmove', e => { if (e.touches && e.touches.length > 1 && !e.target.closest('#escena')) e.preventDefault(); }, { passive:false });

/* ---------- historial: atrás del sistema ---------- */
const NAVH = { depth:0, skip:0 };
function navPush(s){ if (esComputador()) return; try { history.pushState({ rev:s }, ''); NAVH.depth++; } catch (_) {} }
/* Vuelve en el historial si la app había empujado un paso; si no, no hace nada (y devuelve false) */
function navAtras(){ if (NAVH.depth < 1) return false; NAVH.skip++; NAVH.depth--; history.back(); return true; }
window.addEventListener('popstate', () => {
  if (NAVH.skip) { NAVH.skip--; return; }
  if (NAVH.depth > 0) NAVH.depth--;
  if (!$('#hoja').hidden) { cerrarHoja(); navPush('hoja'); return; } /* con una hoja abierta, el gesto solo la cierra */
  if (!$('#v-editor').hidden) volverBiblioteca(true);
});

/* ---------- deslizar desde el borde izquierdo (app instalada) ---------- */
(() => {
  if (!esInstalada()) return;
  let x0 = null, y0 = 0, dx = 0, on = false, t0 = 0;
  const vista = () => $('#v-editor');
  document.addEventListener('touchstart', e => {
    x0 = null;
    if (esComputador() || $('#v-editor').hidden || !$('#hoja').hidden || e.touches.length > 1) return;
    const t = e.touches[0]; if (t.clientX > 24) return;
    x0 = t.clientX; y0 = t.clientY; dx = 0; on = false; t0 = Date.now();
  }, { passive:true });
  document.addEventListener('touchmove', e => {
    if (x0 === null) return; const t = e.touches[0]; dx = t.clientX - x0; const dy = t.clientY - y0;
    if (!on) { if (Math.abs(dy) > 12 && Math.abs(dy) > dx) { x0 = null; return; } if (dx > 10) { on = true; vista().style.transition = 'none'; } else return; }
    e.preventDefault(); vista().style.transform = 'translateX(' + Math.max(0, dx) + 'px)';
  }, { passive:false });
  const fin = () => {
    if (x0 === null) return; x0 = null; if (!on) return; on = false;
    const v = vista(), vel = dx / Math.max(1, Date.now() - t0);
    if (dx > window.innerWidth * .3 || (vel > .45 && dx > 40)) {
      v.style.transition = 'transform .18s ease-out'; v.style.transform = 'translateX(100%)';
      setTimeout(() => { v.style.transition = 'none'; v.style.transform = ''; volverBiblioteca(); requestAnimationFrame(() => { v.style.transition = ''; }); }, 180);
    } else { v.style.transition = 'transform .2s ease-out'; v.style.transform = ''; setTimeout(() => { v.style.transition = ''; }, 220); }
  };
  document.addEventListener('touchend', fin, { passive:true });
  document.addEventListener('touchcancel', fin, { passive:true });
})();

/* Eventos generales y arranque: botones de la biblioteca y del editor, pestañas, cambios de tamaño,
   guardado al salir de la app, instalación sin conexión y recarga automática con cada versión nueva. */

/* ---------- biblioteca ---------- */
$('#f-importar').addEventListener('change', e => { const a = e.target.files; if (a && a.length) importarArchivos(a); e.target.value = ''; });
$('#b-ejemplo').addEventListener('click', fotoEjemplo);
$('#filtros').addEventListener('click', e => {
  if (e.target.closest('[data-album-nuevo]')) return hojaNuevoAlbum();
  const b = e.target.closest('[data-filtro]'); if (b) { BIB.filtro = b.dataset.filtro; pintarBiblioteca(); }
});
$('#b-orden').addEventListener('click', hojaOrden);
$('#b-album-mas').addEventListener('click', hojaOpcionesAlbum);
$('#b-seleccionar').addEventListener('click', () => { if (BIB.seleccionando) salirSeleccion(); else { BIB.seleccionando = true; pintarBiblioteca(); } });
$('#rejilla').addEventListener('click', e => {
  const b = e.target.closest('[data-foto]'); if (!b) return;
  const id = b.dataset.foto;
  if (BIB.seleccionando) { BIB.sel.has(id) ? BIB.sel.delete(id) : BIB.sel.add(id); pintarBiblioteca(); }
  else abrirEditor(id);
});
$('#barra-sel').addEventListener('click', e => { const b = e.target.closest('[data-sel]'); if (b && !b.disabled) accionSeleccion(b.dataset.sel); });
/* arrastrar fotos sobre la ventana en computador */
document.addEventListener('dragover', e => { if (!$('#v-biblioteca').hidden) e.preventDefault(); });
document.addEventListener('drop', e => { if ($('#v-biblioteca').hidden) return; e.preventDefault(); if (e.dataTransfer.files.length) importarArchivos(e.dataTransfer.files); });

/* ---------- editor ---------- */
$('#b-volver').addEventListener('click', () => volverBiblioteca());
$('#b-deshacer').addEventListener('click', deshacer);
$('#b-rehacer').addEventListener('click', rehacer);
$('#b-mas').addEventListener('click', menuMas);
$('#b-exportar').addEventListener('click', () => hojaExportar());
$('#herramientas').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) elegirPanel(b.dataset.p); });
document.addEventListener('keydown', e => {
  if ($('#v-editor').hidden || !$('#hoja').hidden || e.target.closest('input')) return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? rehacer() : deshacer(); }
  else if (e.key === '\\' && !ED.antes) { ED.antes = true; pedirPintura(); }   /* como en Lightroom: \ muestra el original */
  else if (e.key.toLowerCase() === 'y' && !mod) { ED.division = ED.division == null ? .5 : null; pedirPintura(); } /* Y: antes y después */
  else if (e.key.toLowerCase() === 'j' && !mod) { ED.avisos = !ED.avisos; pedirPintura(); }                     /* J: avisos de recorte */
  else if (e.key.toLowerCase() === 'i' && !mod) alternarInfo();
  else if (e.key === 'ArrowRight' && !e.target.closest('.ctl')) navegar(1);
  else if (e.key === 'ArrowLeft' && !e.target.closest('.ctl')) navegar(-1);
});
document.addEventListener('keyup', e => { if (e.key === '\\' && ED.antes) { ED.antes = false; pedirPintura(); } });
/* la foto se reacomoda cada vez que cambia el espacio que le queda (giro del teléfono, panel más alto o más bajo) */
new ResizeObserver(() => { if (!$('#v-editor').hidden) acomodar(); }).observe($('#escena'));
/* guarda la edición al salir de la app o cambiar de pestaña */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && ED.foto && ED.sucio) { clearTimeout(guardadoT); ED.foto.ajustes = clonar(ED.a); ED.foto.editada = ajustesEditados(ED.a); DB.guardar(ED.foto); }
});

/* ---------- arranque ---------- */
(async () => {
  if (!Motor.iniciar($('#lienzo'))) {
    $('#vacio').hidden = false;
    $('#vacio').innerHTML = '<b>Este navegador no puede revelar fotos</b><p>Revelado necesita WebGL2. Actualiza iOS o abre la app en Safari o Chrome recientes.</p>';
    return;
  }
  if (PORTAPAPELES && !PORTAPAPELES.grupos) PORTAPAPELES = null; /* copias de una versión anterior */
  construirPaneles(); construirRecorte(); construirMascaras(); construirQuitar(); construirPresets();
  try {
    await DB.abrir();
    BIB.fotos = await DB.todas(); BIB.albumes = (await DB.albumes()).sort((a, b) => a.fecha - b.fecha);
    PRESETS_PROPIOS = (await DB.presets()).sort((a, b) => a.fecha - b.fecha);
  } catch (e) { console.error(e); toast('No se pudo abrir la biblioteca de este dispositivo', 4000); }
  pintarBiblioteca();
})();

if ('serviceWorker' in navigator && location.protocol === 'https:' && !location.hostname.endsWith('claude.ai') && !/claudeusercontent|claude\.site/.test(location.hostname))
  navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(r => r.update()).catch(() => {});
/* Si hay una versión publicada más nueva, recarga (una vez por sesión, para no entrar en bucle) */
async function revisarVersion(){
  try {
    const v = (await (await fetch('version.json?t=' + Date.now(), { cache:'no-store' })).json()).v;
    if (v && v !== BUILD && !ED.foto) { let ya = false; try { ya = sessionStorage.getItem('revelado.recargada') === v; sessionStorage.setItem('revelado.recargada', v); } catch (_) {} if (!ya) location.reload(); }
  } catch (_) {}
}
if (location.protocol === 'https:') { revisarVersion(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') revisarVersion(); }); }

</script>
