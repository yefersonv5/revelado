<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Revelado</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#101113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Revelado">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<style>
/* ==========================================================================
   Revelado · hoja de estilos
   Concepto: cuarto oscuro de bolsillo. Fondo gris carbón (no negro puro), interfaz
   neutra para no teñir la percepción del color de la foto y un solo color de
   marca, el azul, reservado para la acción principal y lo que está activo.

   Orden: 1 tokens · 2 base · 3 componentes · 4 biblioteca · 5 editor
          6 controles de ajuste · 7 recorte y máscaras · 8 hoja y aviso · 9 computador
   ========================================================================== */

/* ---------- 1. Tokens ---------- */
:root{
  color-scheme:dark;
  /* superficies: cada nivel un poco más claro que el anterior */
  --bg:#101113;
  --surface:#18191C;     /* paneles y hojas */
  --surface-2:#232428;   /* controles dentro de paneles */
  --surface-3:#2F3136;   /* elegido o presionado en controles neutros */
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.14);
  /* texto */
  --ink:#F2F3F5;
  --muted:#9A9CA3;
  --faint:#6D7078;
  /* marca y significado */
  --brand:#3D8BFF;       /* acción principal y lo activo */
  --on-brand:#FFFFFF;
  --danger:#FF5C5C;
  --fav:#FFC94A;         /* estrella de favorita */
  --track:#3A3C42;       /* riel de los deslizadores */
  /* forma */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px;
  --gutter:max(16px,env(safe-area-inset-left,0px));
  --gutter-r:max(16px,env(safe-area-inset-right,0px));
}

/* ---------- 2. Base ---------- */
html{height:100%;height:100dvh;box-sizing:border-box;touch-action:manipulation;text-size-adjust:100%;-webkit-text-size-adjust:100%;overscroll-behavior:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overscroll-behavior:none;background:var(--bg);color:var(--ink);font:400 17px/1.35 var(--font);overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
button,label,input{font:inherit;color:inherit}
/* iOS acerca la página al escribir en campos de menos de 16 px: nunca más chicos en el celular */
@media (pointer:coarse){input,select,textarea{font-size:max(16px,1em)}}
button{background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg .lleno{fill:currentColor}
.oculto{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.flex{flex:1}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{height:100%}
.vista{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}

/* ---------- 3. Componentes ---------- */
/* barra superior de 44 px, como la barra de navegación de iOS */
.barra{display:flex;align-items:center;gap:2px;height:44px;padding:0 max(6px,env(safe-area-inset-right,0px)) 0 max(6px,env(safe-area-inset-left,0px))}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:22px;color:var(--ink)}
.ib svg{width:23px;height:23px}
.ib:disabled{color:var(--faint)}
.ib.activo{color:var(--brand)}
.txt{min-height:44px;padding:0 10px;color:var(--brand);font-size:17px;display:inline-flex;align-items:center;gap:2px}
.txt:disabled{color:var(--faint)}
.txt.peligro,.ib.peligro{color:var(--danger)}
.ib.peligro:disabled{color:var(--faint)}
#sel-cuenta{font-size:15px;font-weight:600}
.acciones-sel{display:flex}
.txt.peligro:disabled{color:var(--faint)}
.volver svg{width:24px;height:24px;stroke-width:2.2;margin-left:-6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:var(--r);
  background:var(--surface-2);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer}
.btn.primario{background:var(--brand);color:var(--on-brand)}
.btn.bloque{width:100%}
.btn.peligro{color:var(--danger)}
.pastilla{position:absolute;font-size:13px;font-weight:600;background:rgba(28,29,32,.82);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  padding:5px 12px;border-radius:14px;pointer-events:none;opacity:0;transition:opacity .15s}
.pastilla.ver{opacity:1}
/* control segmentado de iOS */
.segmento{display:flex;background:var(--surface-2);border-radius:9px;padding:2px;gap:2px}
.segmento button{flex:1;height:30px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;padding:0 8px}
.segmento button[aria-selected="true"]{background:var(--surface-3);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;height:32px;padding:0 14px;border-radius:16px;background:var(--surface-2);font-size:14px}
.chips button.activo{background:var(--ink);color:var(--bg)}

/* ---------- 4. Biblioteca ---------- */
.desliza{overflow-y:auto;overscroll-behavior:contain;padding-bottom:24px}
.titulo-lg{font-size:34px;font-weight:700;letter-spacing:.01em;margin:2px 0 10px;padding:0 var(--gutter-r) 0 var(--gutter)}
#filtros{padding:0 var(--gutter-r) 12px var(--gutter)}
#filtros [data-album-nuevo]{background:none;border:1px dashed var(--line-2);color:var(--muted)}
#rejilla{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.foto{position:relative;aspect-ratio:1;background:var(--surface);overflow:hidden;display:block;width:100%}
.foto img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.foto .fav{position:absolute;left:6px;bottom:5px;width:16px;height:16px;color:var(--fav);filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.foto .fav path{fill:currentColor;stroke:none}
.foto .estr{position:absolute;left:6px;bottom:5px;font-size:11px;letter-spacing:1px;color:var(--fav);text-shadow:0 1px 2px rgba(0,0,0,.8)}
.foto .band{position:absolute;left:5px;top:5px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.foto .band svg{width:16px;height:16px;stroke-width:2}
.foto.rechazada img{opacity:.35}
.foto .ed{position:absolute;right:6px;bottom:6px;width:18px;height:18px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.foto .chk{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:12px;border:1.5px solid #fff;background:rgba(0,0,0,.25);display:none}
.seleccionando .foto .chk{display:block}
.foto.sel .chk{background:var(--brand);border-color:var(--brand)}
.foto.sel .chk::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.foto.sel img{opacity:.75}
.vacio{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:56px var(--gutter-r) 0 var(--gutter)}
.vacio svg{width:56px;height:56px;color:var(--faint);stroke-width:1.2}
.vacio b{font-size:20px}
.vacio p{margin:0 0 6px;color:var(--muted);font-size:15px;max-width:30ch}
.vacio .btn{width:min(100%,300px)}
.barra-inf{display:flex;justify-content:space-between;align-items:center;min-height:50px;background:rgba(24,25,28,.92);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  border-top:.5px solid var(--line-2);padding:0 var(--gutter-r) 0 var(--gutter)}

/* ---------- 5. Editor ---------- */
#v-editor{background:#0B0B0C;will-change:transform}
#escena{position:relative;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
#marco{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#lienzo{display:block;width:100%;height:100%}
#capa{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#capa .vivo{pointer-events:auto}
#histo{position:absolute;top:8px;right:var(--gutter-r);width:120px;height:48px;border-radius:6px;background:rgba(0,0,0,.55);pointer-events:none}
#etq-antes{top:10px;left:50%;transform:translateX(-50%)}
#etq-zoom{bottom:10px;left:50%;transform:translateX(-50%)}
#lateral{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-top:.5px solid var(--line-2)}
#panel{min-height:0;min-width:0}
#lateral,.pane{min-width:0}
.pane{max-height:min(38vh,340px);overflow-y:auto;overscroll-behavior:contain;padding:4px var(--gutter-r) 12px var(--gutter)}
.pcab{display:flex;align-items:center;justify-content:space-between;min-height:40px;gap:8px}
.pcab h2{font-size:15px;font-weight:600;margin:0}
.pcab .txt{font-size:15px;min-height:36px;padding:0 0 0 10px}
.pcab .volver-sub{padding:0 6px 0 0;margin-left:-6px}
.volver-sub svg{width:22px;height:22px;stroke-width:2.2}
.sub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 2px}
.fila-nav{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;font-size:15px;border-bottom:.5px solid var(--line)}
.fila-nav span{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:4px}
.fila-nav svg{width:16px;height:16px;stroke-width:2.2;color:var(--faint)}
.fila-nav.editado b::after{content:"";display:inline-block;width:5px;height:5px;border-radius:3px;background:var(--brand);margin-left:6px;vertical-align:middle}
#herramientas{display:flex;justify-content:space-between;overflow-x:auto;scrollbar-width:none;border-top:.5px solid var(--line);
  padding:2px max(4px,env(safe-area-inset-right,0px)) 2px max(4px,env(safe-area-inset-left,0px))}
#herramientas::-webkit-scrollbar{display:none}
/* en el celular se ven seis herramientas y media: la que queda cortada indica que hay más deslizando */
#herramientas button{flex:0 0 calc((100vw - 8px) / 6.5);min-width:52px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 3px;min-height:52px;
  color:var(--muted);font-size:10px;font-weight:500}
#herramientas svg{width:24px;height:24px;stroke-width:1.5}
#herramientas button[aria-selected="true"]{color:var(--ink)}
#herramientas button::after{content:"";width:4px;height:4px;border-radius:2px;margin-top:1px}
#herramientas button.editado::after{background:var(--brand)}
#herramientas button.activo{color:var(--brand)}

/* color: balance de blancos, muestra de color, versiones */
.fila-bb{display:flex;flex-direction:column;gap:2px;padding:8px 0 2px;font-size:15px}
.fila-bb .chips button{display:inline-flex;align-items:center;gap:6px}
.fila-bb .chips svg{width:18px;height:18px}
#tratamiento{margin:4px 0 2px}
.fila-color{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.fila-color .muestra{width:28px;height:28px;border-radius:14px;border:2px solid var(--line-2)}
.fila-color .txt{margin-left:auto}
.fila-version{display:flex;gap:8px;margin:4px 0 6px}
.fila-version input{flex:1;min-width:0;height:44px;border-radius:var(--r);border:0;background:var(--surface-2);color:var(--ink);padding:0 12px;font-size:16px;user-select:text;-webkit-user-select:text}

/* presets: tira horizontal por grupo */
.tira{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.tira::-webkit-scrollbar{display:none}
.preset{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:12px;scroll-snap-align:start}
.preset canvas,.preset .nuevo{width:74px;height:74px;border-radius:8px;display:block;outline:2px solid transparent;outline-offset:2px;background:var(--surface-2)}
.preset .nuevo{display:grid;place-items:center;color:var(--muted)}
.preset .nuevo svg{width:26px;height:26px}
.preset.activo{color:var(--ink)}
.preset.activo canvas{outline-color:var(--brand)}
.preset span{max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 6. Controles de ajuste ---------- */
/* deslizador al estilo Lightroom: se arrastra en cualquier punto de la fila, sin saltar al tocar */
.ctl{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px;padding-top:6px;touch-action:pan-y;cursor:ew-resize}
.ctl .nom{font-size:14px}
.ctl .val{font:400 13px var(--mono);color:var(--muted);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.ctl.cambiado .val{color:var(--ink)}
.pista{grid-column:1/-1;position:relative;height:28px}
.pista::before{content:"";position:absolute;left:0;right:0;top:13px;height:2px;border-radius:1px;background:var(--riel,var(--track))}
.relleno{position:absolute;top:13px;height:2px;background:#fff;border-radius:1px}
.perilla{position:absolute;top:4px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.ctl:focus-visible{outline-offset:-2px}
.ctl.arrastrando .perilla{transform:scale(1.15)}
.auto{display:flex;gap:8px;padding:4px 0 2px}
/* curva de tonos */
.curva-canal{display:flex;gap:10px;padding:6px 0}
.curva-canal [data-canal]{width:30px;height:30px;border-radius:15px;border:2px solid transparent}
.curva-canal [data-canal].activo{border-color:var(--ink)}
#curva-svg{width:min(100%,240px);aspect-ratio:1;display:block;margin:4px auto 0;touch-action:none;background:var(--surface-2);border-radius:8px}
#curva-svg .reja{stroke:var(--line-2);stroke-width:1}
#curva-svg .linea{stroke-width:2}
#curva-svg .pto{stroke:#fff;stroke-width:2;fill:var(--surface)}
#curva-svg .pto.sel{fill:#fff}
/* mezcla de color: puntos de color */
.puntos{display:flex;justify-content:space-between;padding:8px 0 4px}
.puntos button{width:30px;height:30px;border-radius:15px;border:2px solid transparent;outline-offset:1px}
.puntos button.activo{border-color:#fff}
/* gradación: rueda de color */
.ruedas{display:flex;justify-content:center;padding:6px 0}
.rueda{position:relative;width:170px;height:170px;border-radius:50%;touch-action:none;
  background:radial-gradient(circle,#808080 0,rgba(128,128,128,0) 70%),conic-gradient(from 90deg,#f44,#e4e,#44f,#4ee,#4e4,#ee4,#fa3,#f44)}
.rueda .p{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.6)}

/* ---------- 7. Recorte y máscaras ---------- */
#capa .sombra{fill:rgba(0,0,0,.55)}
#capa .rect{stroke:#fff;stroke-width:1.5;fill:none}
#capa .tercio{stroke:rgba(255,255,255,.45);stroke-width:.75}
#capa .asa{stroke:#fff;stroke-width:4;stroke-linecap:square}
#capa .linea-m{stroke:#fff;stroke-width:1.5}
#capa .linea-m.trazo{stroke-dasharray:5 5}
#capa .nodo{fill:var(--brand);stroke:#fff;stroke-width:2}
#capa .nodo.chico{fill:#fff;stroke:var(--brand)}
#capa .elipse{stroke:#fff;stroke-width:1.5;fill:none}
#capa .division{stroke:#fff;stroke-width:2}
#capa [data-division]{fill:#fff;stroke:rgba(0,0,0,.4);stroke-width:1}
#capa circle[data-mancha]{fill:transparent;pointer-events:auto}
#etq-division .pastilla{top:10px}
#etq-division .pastilla:first-child{left:var(--gutter)}
#etq-division .pastilla:last-child{right:var(--gutter-r)}
.info{position:absolute;top:8px;left:var(--gutter);max-width:70%;font-size:12px;line-height:1.45;background:rgba(0,0,0,.6);padding:8px 10px;border-radius:8px;pointer-events:none;font-variant-numeric:tabular-nums}
#capa .elipse.int{stroke-dasharray:4 5;stroke-opacity:.7}
.lista-m{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.lista-m::-webkit-scrollbar{display:none}
.lista-m button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);min-width:64px}
.lista-m .ico{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;background:var(--surface-2);border:2px solid transparent}
.lista-m .ico svg{width:24px;height:24px}
.lista-m button.activo{color:var(--ink)}
.lista-m button.activo .ico{border-color:var(--brand)}
.nota{font-size:13px;color:var(--muted);margin:6px 0 0}

/* ---------- 8. Hoja y aviso ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;transition:opacity .25s}
#hoja{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);
  border-radius:14px 14px 0 0;padding:6px var(--gutter-r) calc(18px + env(safe-area-inset-bottom,0px)) var(--gutter);
  transition:transform .28s cubic-bezier(.2,.8,.2,1);transform:translateY(0)}
#hoja.entrando{transform:translateY(100%)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--surface-3);margin:2px auto 8px}
.hcab{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:4px}
.hcab b{font-size:17px}
.x{width:30px;height:30px;border-radius:15px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center}
.x svg{width:14px;height:14px;stroke-width:2.4}
.grupo{background:var(--surface-2);border-radius:var(--r);overflow:hidden;margin:6px 0 14px}
.grupo > *{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:46px;padding:0 14px;font-size:16px;text-align:left}
.grupo > * + *{border-top:.5px solid var(--line-2)}
.grupo .ico-f{width:22px;height:22px;color:var(--brand);flex:0 0 auto}
.grupo .izq{display:flex;align-items:center;gap:12px;min-width:0}
.grupo small{color:var(--muted);font-size:14px}
.grupo .peligro{color:var(--danger)}
.grupo input[type=text]{flex:1;min-width:0;background:none;border:0;color:var(--ink);font-size:16px;padding:12px 0;outline:none;user-select:text;-webkit-user-select:text}
.grupo .marca{cursor:pointer}
.marca input{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--surface-3);position:relative;flex:0 0 auto;transition:background .2s;margin:0}
.marca input::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.marca input:checked{background:#34C759}
.marca input:checked::after{transform:translateX(20px)}
.grupo small svg{width:14px;height:14px;vertical-align:-2px}
.grupo > button > svg{width:16px;height:16px;stroke-width:2.2;color:var(--faint);flex:0 0 auto}
.grupo .ico-f svg{width:22px;height:22px}
.estrellas{display:flex;gap:6px;justify-content:center;padding:6px 0 10px}
.estrellas button{width:44px;height:44px;display:grid;place-items:center;color:var(--faint)}
.estrellas button svg{width:28px;height:28px}
.estrellas button.on{color:var(--fav)}
.estrellas button.on path{fill:currentColor}
.vista-exp{display:block;max-width:100%;max-height:48vh;margin:4px auto 12px;border-radius:8px;user-select:auto;-webkit-user-select:auto;-webkit-touch-callout:default}
.ayuda{font-size:13px;color:var(--muted);text-align:center;margin:0 0 12px}
#aviso{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;max-width:calc(100% - 32px);
  background:rgba(44,45,50,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:9px 16px;border-radius:18px;font-size:14px;text-align:center}

/* ---------- 9. Computador ---------- */
@media (min-width:1024px){
  body{font-size:15px}
  #rejilla{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;padding:0 var(--gutter-r) 0 var(--gutter)}
  .foto{border-radius:8px}
  #v-editor{grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr)}

<div id="scrim" hidden></div>
<div id="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo" hidden></div>
<div id="aviso" role="status" hidden></div>

<script>
const BUILD = '20261027010128';
/* Núcleo: utilidades pequeñas, aviso tipo iOS, hojas que suben desde abajo y el gesto de arrastrarlas para cerrar. */

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const clonar = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const esperar = ms => new Promise(r => setTimeout(r, ms));
const esComputador = () => window.innerWidth >= 1024;

/* Íconos que se repiten en varias pantallas */
const ICO = {
  cerrar:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  chev:'<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>',
  estrella:'<svg viewBox="0 0 24 24"><path d="m12 3.2 2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17l-5.38 2.85 1.03-6L3.3 9.6l6-.9z"/></svg>',
  editada:'<svg viewBox="0 0 24 24"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg>',
};

/* ---------- aviso breve arriba, como las notificaciones de iOS ---------- */
let avisoT;
function toast(msg, ms = 2000){
  const a = $('#aviso'); a.textContent = msg; a.hidden = false;
  clearTimeout(avisoT); avisoT = setTimeout(() => { a.hidden = true; }, ms);
}

/* ---------- hojas ----------
   abrirHoja(html) pinta el contenido con su agarradera; cerrarHoja() la baja.
   Un botón con data-cerrar dentro de la hoja la cierra. alCerrarHoja se llama una vez al cerrar. */
let alCerrarHoja = null;
const cabHoja = titulo => '<div class="hcab"><b id="hoja-titulo">' + esc(titulo) + '</b><button class="x" data-cerrar aria-label="Cerrar">' + ICO.cerrar + '</button></div>';
function abrirHoja(html, alCerrar = null){
  const h = $('#hoja'), s = $('#scrim');
  if (h.hidden && alCerrarHoja) { const f = alCerrarHoja; alCerrarHoja = null; f(); }
  alCerrarHoja = alCerrar;
  h.innerHTML = '<div class="grab"></div>' + html;
  if (h.hidden) { h.classList.add('entrando'); h.hidden = false; s.hidden = false; s.style.opacity = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => { h.classList.remove('entrando'); s.style.opacity = ''; })); }
  h.scrollTop = 0;
  const f = h.querySelector('input[autofocus]'); if (f) setTimeout(() => f.focus(), 280);
}
function cerrarHoja(){
  const h = $('#hoja'), s = $('#scrim'); if (h.hidden) return;
  h.classList.add('entrando'); s.style.opacity = '0';
  setTimeout(() => { h.hidden = true; s.hidden = true; h.classList.remove('entrando'); h.style.transform = ''; s.style.opacity = ''; h.innerHTML = ''; }, 260);
  if (alCerrarHoja) { const f = alCerrarHoja; alCerrarHoja = null; f(); }
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-cerrar]') || e.target.id === 'scrim') cerrarHoja();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarHoja(); });

/* Arrastrar la hoja hacia abajo para cerrarla (celular). Igual que en Caudal: si la hoja está
   desplazada, primero sube el contenido y, cuando llega arriba, el mismo gesto baja la hoja. */
(() => {
  let y0 = null, x0 = 0, dy = 0, arrastra = false, rastro = [];
  const hoja = () => $('#hoja');
  document.addEventListener('touchstart', e => {
    const h = hoja(); if (h.hidden || esComputador() || e.touches.length > 1 || !h.contains(e.target)) return;
    if (e.target.closest('input,.ctl,.rueda,#curva-svg') && !e.target.closest('.grab,.hcab')) return;
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; arrastra = false; rastro = [[Date.now(), y0]];
  }, { passive:true });
  document.addEventListener('touchmove', e => {
    if (y0 === null) return; const h = hoja(), y = e.touches[0].clientY, x = e.touches[0].clientX;
    if (!arrastra) {
      if (Math.abs(x - x0) > 14 && Math.abs(x - x0) > Math.abs(y - y0)) { y0 = null; return; } /* gesto lateral */
      if (h.scrollTop > 0 && !e.target.closest('.grab,.hcab')) { y0 = y; return; }        /* aún sube el contenido */
      if (y - y0 > 6) { arrastra = true; h.style.transition = 'none'; } else return;
    }
    e.preventDefault();
    dy = Math.max(0, y - y0); h.style.transform = 'translateY(' + dy + 'px)';
    rastro.push([Date.now(), y]); if (rastro.length > 6) rastro.shift();
    $('#scrim').style.opacity = String(Math.max(0, 1 - dy / 400));
  }, { passive:false });
  const fin = () => {
    if (y0 === null) return; const h = hoja(); y0 = null;
    if (!arrastra) return; arrastra = false;
    const a = rastro[0], z = rastro[rastro.length - 1], v = z && a && z[0] > a[0] ? (z[1] - a[1]) / (z[0] - a[0]) : 0; /* px por ms */
    h.style.transition = ''; $('#scrim').style.opacity = '';
    if (dy > 80 || (v > 0.4 && dy > 24)) { h.style.transform = 'translateY(100%)'; cerrarHoja(); }
    else h.style.transform = '';
  };
  document.addEventListener('touchend', fin, { passive:true });
  document.addEventListener('touchcancel', fin, { passive:true });
})();

/* ---------- confirmación dentro de una hoja (sin confirm(), que iOS bloquea en apps instaladas) ---------- */
function confirmar(titulo, texto, accion, etiqueta = 'Eliminar'){
  return new Promise(res => {
    let ok = false;
    abrirHoja(cabHoja(titulo) + '<p class="ayuda" style="text-align:left;font-size:15px">' + esc(texto) + '</p>' +
      '<div class="grupo"><button data-confirma class="' + (accion === 'peligro' ? 'peligro' : '') + '" style="justify-content:center;font-weight:600">' + esc(etiqueta) + '</button></div>' +
      '<div class="grupo"><button data-cerrar style="justify-content:center">Cancelar</button></div>', () => res(ok));
    $('#hoja [data-confirma]').onclick = () => { ok = true; cerrarHoja(); };
  });
}

/* Ajustes: valores por defecto, controles de cada panel, perfiles, bandas de la mezcla de color, máscaras,
   grupos para copiar ajustes y presets incluidos.
   Un ajuste de foto es un objeto plano de números (DEF) más: perfil, curva, geo (giro, volteo, enderezar
   y recorte), mascaras, manchas (herramienta Quitar) y desenfoque (desenfoque de lente). */

/* Bandas de la mezcla de color: tono central en grados y color del punto en la interfaz */
const BANDAS = [
  { k:'rojo', nom:'Rojo', hue:0, color:'#E5484D' },
  { k:'naranja', nom:'Naranja', hue:30, color:'#F08C2E' },
  { k:'amarillo', nom:'Amarillo', hue:58, color:'#E8D33F' },
  { k:'verde', nom:'Verde', hue:120, color:'#4CB860' },
  { k:'aguamarina', nom:'Aguamarina', hue:180, color:'#3EC7C7' },
  { k:'azul', nom:'Azul', hue:225, color:'#3B7CF0' },
  { k:'purpura', nom:'Púrpura', hue:275, color:'#9056E0' },
  { k:'magenta', nom:'Magenta', hue:320, color:'#D64FB3' },
];
const ZONAS = [ { k:'sombras', nom:'Sombras' }, { k:'medios', nom:'Medios tonos' }, { k:'luces', nom:'Luces' }, { k:'global', nom:'Global' } ];

/* Valores numéricos por defecto. Casi todos van de -100 a 100 y valen 0 */
const DEF = {
  /* luz */
  exposicion:0, contraste:0, altas:0, sombras:0, blancos:0, negros:0,
  /* color */
  temperatura:0, matiz:0, intensidad:0, saturacion:0,
  g_mezcla:50, g_balance:0,
  /* efectos */
  textura:0, claridad:0, neblina:0,
  vineta:0, vineta_punto:50, vineta_redondez:0, vineta_desv:50, vineta_altas:0,
  grano:0, grano_tam:25, grano_asp:50,
  /* detalle */
  nitidez:0, nitidez_radio:1, nitidez_detalle:25, nitidez_mascara:0,
  ruido:0, ruido_detalle:50, ruido_color:0,
  /* óptica */
  aberracion:0, desfleco_purpura:0, desfleco_verde:0, vineteado_lente:0, vineteado_punto:50,
  /* geometría */
  distorsion:0, vertical:0, horizontal:0, rotar:0, aspecto:0, escala:100, desp_x:0, desp_y:0, restringir:0,
};
BANDAS.forEach(b => { DEF['m_' + b.k + '_h'] = 0; DEF['m_' + b.k + '_s'] = 0; DEF['m_' + b.k + '_l'] = 0; });
ZONAS.forEach(z => { DEF['g_' + z.k + '_h'] = 0; DEF['g_' + z.k + '_s'] = 0; DEF['g_' + z.k + '_l'] = 0; });

const CURVA_DEF = { rgb:[[0, 0], [1, 1]], r:[[0, 0], [1, 1]], g:[[0, 0], [1, 1]], b:[[0, 0], [1, 1]], param:[0, 0, 0, 0] };
const GEO_DEF = { rot:0, flipH:false, flipV:false, angulo:0, x:0, y:0, w:1, h:1, aspecto:'libre' };
const PERFIL_DEF = { id:'color', cant:100 };
const DESENFOQUE_DEF = { cant:0, cx:.5, cy:.5, rx:.18, ry:.24, ang:0, desv:60, tipo:'radial' };

/* Ajuste completo sin cambios */
const ajustesBase = () => Object.assign(clonar(DEF), { perfil:clonar(PERFIL_DEF), curva:clonar(CURVA_DEF), geo:clonar(GEO_DEF), mascaras:[], manchas:[], desenfoque:clonar(DESENFOQUE_DEF) });

/* Completa un ajuste guardado con lo que le falte (por si la app agrega ajustes nuevos) */
function completarAjustes(a){
  const b = ajustesBase();
  if (!a) return b;
  for (const k in DEF) if (typeof a[k] === 'number') b[k] = a[k];
  if (a.perfil && PERFILES.some(p => p.id === a.perfil.id)) b.perfil = { id:a.perfil.id, cant:a.perfil.cant ?? 100 };
  if (a.curva) for (const c in CURVA_DEF) if (Array.isArray(a.curva[c]) && a.curva[c].length >= (c === 'param' ? 4 : 2)) b.curva[c] = a.curva[c];
  if (a.geo) Object.assign(b.geo, a.geo);
  if (a.desenfoque) Object.assign(b.desenfoque, a.desenfoque);
  if (Array.isArray(a.manchas)) b.manchas = a.manchas;
  b.bbAuto = !!a.bbAuto;
  if (Array.isArray(a.mascaras)) b.mascaras = a.mascaras.map(m => { const base = mascaraBase(m.tipo); return Object.assign(base, m, { a:Object.assign(base.a, m.a || {}) }); });
  return b;
}

const curvaRecta = c => c.length === 2 && c[0][0] === 0 && c[0][1] === 0 && c[1][0] === 1 && c[1][1] === 1;
const curvaEditada = cv => !['rgb', 'r', 'g', 'b'].every(k => curvaRecta(cv[k])) || cv.param.some(v => v);
const cambiado = (a, claves) => claves.some(k => a[k] !== DEF[k]);
const geoEditada = g => g.rot || g.flipH || g.flipV || g.angulo || g.x || g.y || g.w !== 1 || g.h !== 1;

/* ¿La foto tiene algún cambio? Sirve para la marca de "editada" en la biblioteca */
const ajustesEditados = a => cambiado(a, Object.keys(DEF)) || a.perfil.id !== 'color' || curvaEditada(a.curva) || geoEditada(a.geo) ||

/* Copia en destino solo los grupos marcados */
function aplicarGrupos(destino, origen, grupos){
  const a = completarAjustes(clonar(destino)), o = completarAjustes(clonar(origen));
  for (const g of grupos) {
    if (CLAVES[g]) CLAVES[g].forEach(k => { a[k] = o[k]; });
    if (g === 'perfil') a.perfil = o.perfil;
    if (g === 'curva') a.curva = o.curva;

    if (g === 'manchas') a.manchas = o.manchas;
    if (g === 'recorte') a.geo = o.geo;
  }
  return a;
}

  lineal:{ nom:'Degradado lineal', corto:'Lineal' }, radial:{ nom:'Degradado radial', corto:'Radial' }, pincel:{ nom:'Pincel', corto:'Pincel' },
  color:{ nom:'Rango de color', corto:'Color' }, luminancia:{ nom:'Rango de luminancia', corto:'Luminancia' },

function mascaraBase(tipo){
  const a = {}; AJ_MASCARA.forEach(c => { a[c.k] = 0; });
  /* coordenadas en la foto original (0 a 1). Lineal: de p0 (efecto completo) a p1 (sin efecto).
     Radial: centro, radios como fracción del lado mayor, ángulo y desvanecido.
     Pincel: trazos con radio en fracción del lado mayor. Rangos: valores de 0 a 1. */
  const m = { id:uid(), tipo, invertir:false, cant:100, a };
  if (tipo === 'radial') Object.assign(m, { cx:.5, cy:.5, rx:.22, ry:.16, ang:0, desv:50 });
  else if (tipo === 'pincel') Object.assign(m, { trazos:[] });
  else if (tipo === 'color') Object.assign(m, { col:null, tol:30 });
  else if (tipo === 'luminancia') Object.assign(m, { desde:60, hasta:100, suav:20 });
  else Object.assign(m, { tipo:'lineal', x0:.5, y0:.15, x1:.5, y1:.55 });
  return m;
}

/* Mezcla un preset con la intensidad elegida (0 a 2): 1 es el preset tal cual */
const CLAVES_PRESET = Object.keys(DEF).filter(k => !CLAVES.optica.includes(k) && !CLAVES.geometria.includes(k));
function ajustesDePreset(base, p, cant = 1){
  const a = completarAjustes(clonar(base));
  CLAVES_PRESET.forEach(k => { a[k] = DEF[k]; });
  a.curva = clonar(CURVA_DEF); a.perfil = { id:p.perfil || 'color', cant:100 };
  /* el tono de la gradación no se escala: la intensidad la da su saturación */
  for (const k in (p.a || {})) a[k] = /^g_.+_h$/.test(k) ? p.a[k] : clampAjuste(k, DEF[k] + (p.a[k] - DEF[k]) * cant);
  for (const c in (p.curva || {})) a.curva[c] = c === 'param' ? p.curva[c].map(v => v * cant) : p.curva[c].map(([x, y]) => [x, clamp(x + (y - x) * cant, 0, 1)]);
  return a;
}

/* Límites de cada clave numérica, tomados de los controles */
const LIMITES = {};
Object.values(PANELES).flat().forEach(c => { LIMITES[c.k] = [c.min ?? -100, c.max ?? 100]; });
BANDAS.forEach(b => ['h', 's', 'l'].forEach(x => { LIMITES['m_' + b.k + '_' + x] = [-100, 100]; }));
ZONAS.forEach(z => { LIMITES['g_' + z.k + '_h'] = [0, 360]; LIMITES['g_' + z.k + '_s'] = [0, 100]; LIMITES['g_' + z.k + '_l'] = [-100, 100]; });
LIMITES.g_mezcla = [0, 100]; LIMITES.g_balance = [-100, 100];
const clampAjuste = (k, v) => LIMITES[k] ? clamp(v, LIMITES[k][0], LIMITES[k][1]) : v;

/* Valores efectivos para el motor: tus ajustes más el perfil (escalado por su intensidad) */
function ajustesEfectivos(a){
  const p = perfilDe(a), k = a.perfil.cant / 100, e = Object.assign({}, a);
  for (const c in p.a) e[c] = /^g_.+_h$/.test(c) ? (a[c.replace('_h', '_s')] ? a[c] : p.a[c]) : clampAjuste(c, a[c] + p.a[c] * k);
  e.bn = p.bn ? 1 : 0;
  e.curvaPerfil = p.curva ? p.curva.map(([x, y]) => [x, x + (y - x) * Math.min(k, 2)]) : null;
  return e;
}

/* Curva de tonos: interpolación suave sin rebotes (Fritsch-Carlson), tabla de 256 valores para el motor
   y el editor táctil de puntos con canales RGB, rojo, verde y azul. */

/* Devuelve una función x -> y que pasa por los puntos sin crear oscilaciones */
function interpolador(pts){
  const p = pts.slice().sort((a, b) => a[0] - b[0]), n = p.length;
  if (n < 2) return x => x;
  const dx = [], m = [], t = new Array(n);
  for (let i = 0; i < n - 1; i++) { dx[i] = Math.max(1e-6, p[i + 1][0] - p[i][0]); m[i] = (p[i + 1][1] - p[i][1]) / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  return x => {
    if (x <= p[0][0]) return p[0][1];
    if (x >= p[n - 1][0]) return p[n - 1][1];
    let i = 0; while (x > p[i + 1][0]) i++;
    const h = dx[i], u = (x - p[i][0]) / h, u2 = u * u, u3 = u2 * u;
    return clamp((2 * u3 - 3 * u2 + 1) * p[i][1] + (u3 - 2 * u2 + u) * h * t[i] + (-2 * u3 + 3 * u2) * p[i + 1][1] + (u3 - u2) * h * t[i + 1], 0, 1);
  };
}

/* Curva paramétrica de Lightroom: altas luces, claros, oscuros y sombras (-100 a 100), cada región
   es una campana suave centrada en su cuarto del rango */
function paramFn(par){
  if (!par.some(v => v)) return x => x;
  const centros = [.875, .625, .375, .125];
  return x => clamp(x + par.reduce((s, v, i) => { const d = Math.abs(x - centros[i]) / .25; return s + (d < 1 ? (Math.cos(d * Math.PI) + 1) / 2 : 0) * v / 100 * .22 * Math.sin(Math.PI * x); }, 0), 0, 1);
}

/* Tabla para el motor: la curva del perfil, la paramétrica, la de puntos RGB y la de cada canal, en ese orden */
function curvaLUT(cv, perfil = null){
  const fp = perfil ? interpolador(perfil) : (x => x), fq = paramFn(cv.param || [0, 0, 0, 0]);
  const fm = interpolador(cv.rgb), fr = interpolador(cv.r), fg = interpolador(cv.g), fb = interpolador(cv.b);
  const out = new Uint8Array(256 * 4);
  for (let i = 0; i < 256; i++) {
    const m = fm(fq(fp(i / 255)));
    out[i * 4] = Math.round(fr(m) * 255); out[i * 4 + 1] = Math.round(fg(m) * 255); out[i * 4 + 2] = Math.round(fb(m) * 255); out[i * 4 + 3] = 255;
  }
  return out;
}

/* ---------- editor ----------

const CANALES = [ { k:'rgb', color:'#FFFFFF' }, { k:'r', color:'#FF5A52' }, { k:'g', color:'#3FCB61' }, { k:'b', color:'#4C8DFF' } ];
let canalCurva = 'rgb';

let modoCurva = 'puntos';
const PARAM = ['Altas luces', 'Claros', 'Oscuros', 'Sombras'];
function htmlCurva(){

}

/* Pinta la curva del canal activo. alCambiar(soltó) se llama al mover (false) y al soltar (true). */
function montarCurva(raiz, leer, alCambiar){
  /* alCambiar(null) pide volver a pintar la subvista con el otro modo */
  const modo = e => { const b = e.target.closest('[data-modo-curva]'); if (b && b.dataset.modoCurva !== modoCurva) { modoCurva = b.dataset.modoCurva; alCambiar(null); return true; } };
  if (modoCurva === 'param') {
    raiz.onclick = modo;
    PARAM.forEach((nom, i) => $('#curva-param', raiz).appendChild(deslizador({ k:'param' + i, nom }, () => leer().param[i], (k, v, final) => { leer().param[i] = v; alCambiar(final); })));
    return;
  }
  const svg = $('#curva-svg', raiz);
  const pintar = () => {
    const cv = leer(), pts = cv[canalCurva], f = interpolador(pts), col = CANALES.find(c => c.k === canalCurva).color;
    let d = ''; for (let i = 0; i <= 64; i++) { const x = i / 64; d += (i ? 'L' : 'M') + (x * 256).toFixed(1) + ' ' + ((1 - f(x)) * 256).toFixed(1); }
    let h = '';
    for (let i = 1; i < 4; i++) h += '<path class="reja" d="M' + i * 64 + ' 0V256M0 ' + i * 64 + 'H256"/>';
    h += '<path class="reja" d="M0 256L256 0" stroke-dasharray="3 4"/>';
    h += '<path class="linea" d="' + d + '" stroke="' + col + '"/>';
    pts.forEach((p, i) => { h += '<circle class="pto' + (i === sel ? ' sel' : '') + '" cx="' + p[0] * 256 + '" cy="' + (1 - p[1]) * 256 + '" r="7"/>'; });
    svg.innerHTML = h;
    $$('[data-canal]', raiz).forEach(b => b.classList.toggle('activo', b.dataset.canal === canalCurva));
  };
  let sel = -1, arrastra = false, ultimoToque = 0;
  const pos = e => { const r = svg.getBoundingClientRect(); return [clamp((e.clientX - r.left) / r.width, 0, 1), clamp(1 - (e.clientY - r.top) / r.height, 0, 1), (e.clientY - r.top) / r.height]; };
  svg.addEventListener('pointerdown', e => {
    e.preventDefault(); svg.setPointerCapture(e.pointerId);
    const pts = leer()[canalCurva], [x, y] = pos(e);
    let cerca = -1, dmin = 0.06;
    pts.forEach((p, i) => { const dd = Math.hypot(p[0] - x, p[1] - y); if (dd < dmin) { dmin = dd; cerca = i; } });
    const ahora = Date.now();
    if (cerca >= 0 && ahora - ultimoToque < 320 && cerca === sel && cerca > 0 && cerca < pts.length - 1) { pts.splice(cerca, 1); sel = -1; pintar(); alCambiar(true); return; }
    ultimoToque = ahora;
    if (cerca < 0) { pts.push([x, y]); pts.sort((a, b) => a[0] - b[0]); cerca = pts.findIndex(p => p[0] === x && p[1] === y); }
    sel = cerca; arrastra = true; pintar(); alCambiar(false);
  });
  svg.addEventListener('pointermove', e => {
    if (!arrastra || sel < 0) return;
    const pts = leer()[canalCurva], [x, y, yb] = pos(e), n = pts.length;
    const lo = sel === 0 ? 0 : pts[sel - 1][0] + .01, hi = sel === n - 1 ? 1 : pts[sel + 1][0] - .01;
    pts[sel] = [clamp(x, lo, hi), y];
    if (sel > 0 && sel < n - 1 && (yb > 1.12 || yb < -0.12)) { pts.splice(sel, 1); sel = -1; arrastra = false; }
    pintar(); alCambiar(false);
  });
  const soltar = () => { if (arrastra) { arrastra = false; alCambiar(true); } };
  svg.addEventListener('pointerup', soltar); svg.addEventListener('pointercancel', soltar);
  raiz.onclick = e => {
    if (modo(e)) return;
    const c = e.target.closest('[data-canal]'); if (c) { canalCurva = c.dataset.canal; sel = -1; pintar(); }
    if (e.target.closest('[data-curva-reset]')) { leer()[canalCurva] = [[0, 0], [1, 1]]; sel = -1; pintar(); alCambiar(true); }
  };
  pintar();
  return pintar;
}

/* Motor de revelado en WebGL2.
   Una "fuente" es la foto subida como textura más cuatro desenfoques que alimentan los ajustes locales:
   S (detalle fino: nitidez y ruido), M (textura), L (claridad) y H (neblina). Un solo sombreador aplica todo
   en este orden, como Lightroom:
     geometría (recorte, enderezar, transformación y distorsión) > aberración cromática > Quitar >
     desenfoque de lente > ruido > nitidez > desfleco > textura y claridad > neblina > viñeteado del objetivo >
     exposición y balance de blancos > tono > curva (perfil, paramétrica y de puntos) > mezcla de color o
     blanco y negro > intensidad y saturación > gradación > máscaras > viñeta > grano > avisos de recorte. */

const VS = `#version 300 es
in vec2 a; uniform float uVoltear; out vec2 vUV;
void main(){ vUV = vec2(a.x * .5 + .5, uVoltear > .5 ? .5 - a.y * .5 : .5 + a.y * .5); gl_Position = vec4(a, 0., 1.); }`;

/* desenfoque gaussiano separable de 15 muestras */
const FS_DESENFOQUE = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 o;
uniform sampler2D uT; uniform vec2 uDir; uniform float uSigma;
void main(){
  vec4 s = vec4(0.); float ws = 0.;
  for (int i = -7; i <= 7; i++) {
    float x = float(i) * uSigma * 3. / 7.; float w = exp(-x * x / (2. * uSigma * uSigma));
    s += texture(uT, vUV + uDir * x) * w; ws += w;
  }
  o = s / ws;
}`;

const FS_REVELADO = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 o;
uniform sampler2D uSrc, uS, uM, uL, uH, uCurva, uPincel;
uniform highp sampler2D uManchas;
uniform mat3 uGeo1, uGeo2;
uniform vec2 uWo, uSal, uAsp;
uniform vec4 uW1, uW2;
uniform float uAntes, uSemilla, uDiv, uAvisos;
uniform vec4 uA1, uA2, uA3, uA4, uA5, uA6, uVin, uOpt, uOpt2, uDes, uDes2;
uniform vec3 uMez[8];
uniform vec4 uGrad[4];
uniform vec2 uGradMB;
uniform int uNM, uVerM, uNS;
uniform vec4 uMG[24], uMA[32];

const float TONOS[8] = float[8](0., 30., 58., 120., 180., 225., 275., 320.);

float lum(vec3 c){ return dot(c, vec3(.2126, .7152, .0722)); }
vec3 rgb2hsv(vec3 c){
  vec4 K = vec4(0., -1. / 3., 2. / 3., -1.);
  vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
  float d = q.x - min(q.w, q.y), e = 1e-10;
  return vec3(abs(q.z + (q.w - q.y) / (6. * d + e)), d / (q.x + e), q.x);
}
vec3 hsv2rgb(vec3 c){
  vec4 K = vec4(1., 2. / 3., 1. / 3., 3.);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6. - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0., 1.), c.y);
}
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float ruidoValor(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  float a = hash(i + uSemilla), b = hash(i + vec2(1., 0.) + uSemilla), c = hash(i + vec2(0., 1.) + uSemilla), d = hash(i + vec2(1., 1.) + uSemilla);
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
/* transformación de geometría en el marco orientado (0..1): escala, desplazamiento, aspecto, rotación,
   perspectiva vertical y horizontal, y distorsión de barril o cojín */
vec2 deformar(vec2 o){
  vec2 P = (o - .5) * uWo;
  P = P / uW1.x - vec2(uW2.z, -uW2.w) * .25;
  if (uW1.y > 0.) P.x /= 1. + uW1.y * .3; else P.y /= 1. - uW1.y * .3;
  float cr = cos(uW1.z), sr = sin(uW1.z); P = vec2(cr * P.x - sr * P.y, sr * P.x + cr * P.y);
  P /= 1. - uW2.x * .9 * P.y - uW2.y * .9 * P.x;
  P *= 1. + uW1.w * dot(P, P) * 1.2;
  return P / uWo + .5;
}
/* tono sobre la luminancia; todos los valores van de -1 a 1 */
float tono(float L, float con, float alt, float som, float bla, float neg){
  L += bla * .2 * smoothstep(.45, 1., L);
  L += neg * .2 * (1. - smoothstep(0., .55, L));
  L += alt * .32 * smoothstep(.4, 1., L);
  L += som * .32 * (1. - smoothstep(0., .6, L));
  float Lc = clamp(L, 0., 1.), S = Lc * Lc * (3. - 2. * Lc) + (L - Lc);
  return con >= 0. ? mix(L, S, con * .9) : mix(L, .5 + (L - .5) * .55, -con);
}
/* lleva el color a la nueva luminancia: mitad proporcional (conserva saturación) y mitad aditiva (no revienta sombras) */
vec3 aplicarL(vec3 c, float L, float nL){ return mix(c + (nL - L), c * (nL / max(L, .02)), .5); }
vec3 balance(float te, float ti){
  vec3 wb = vec3(1. + te * .28, 1., 1. - te * .28) * vec3(1. + ti * .12, 1. - ti * .18, 1. + ti * .12);
  return wb / lum(wb);
}
vec3 neblina(vec3 c, float dh, vec3 h){
  if (dh > 0.) { float t = max(1. - dh * .85 * min(h.r, min(h.g, h.b)), .25); return (c - .95) / t + .95; }
  return mix(c, vec3(.8), -dh * .4);
}
/* ajustes de una máscara con peso w.
   a0: temperatura, matiz, exposición, contraste; a1: altas, sombras, blancos, negros;
   a2: saturación, textura, claridad, neblina; a3: nitidez, ruido, color (tono 0..1), color (intensidad) */
vec3 local(vec3 c, float w, vec4 a0, vec4 a1, vec4 a2, vec4 a3, vec3 det, vec3 s, vec3 m, vec3 h){
  if (a3.y > 0.) c = mix(c, s, a3.y * w * .8);
  c = a3.x >= 0. ? c + (c - s) * a3.x * w * 1.5 : mix(c, m, -a3.x * w);
  c += (s - m) * a2.y * w * 1.3;
  float Lm = lum(c); c += det * a2.z * .9 * 4. * Lm * (1. - Lm) * w;
  if (a2.w != 0.) c = neblina(c, a2.w * w, h);
  vec3 lin = pow(max(c, 0.), vec3(2.2)) * exp2(a0.z * w) * balance(a0.x * w, a0.y * w);
  c = pow(lin, vec3(1. / 2.2));
  float L = lum(c); c = aplicarL(c, L, tono(L, a0.w * w, a1.x * w, a1.y * w, a1.z * w, a1.w * w));
  float L2 = lum(c); c = vec3(L2) + (c - vec3(L2)) * max(0., 1. + a2.x * w);
  if (a3.w > 0.) { vec3 col = hsv2rgb(vec3(a3.z, 1., 1.)); c += (col - vec3(lum(col))) * a3.w * .3 * w; }
  return c;
}

void main(){
  /* geometría: de la salida al marco orientado, transformación y de ahí a la foto */
  vec2 po = (uGeo1 * vec3(vUV, 1.)).xy;
  vec2 uv = (uGeo2 * vec3(deformar(po), 1.)).xy;
  if (uv.x < 0. || uv.y < 0. || uv.x > 1. || uv.y > 1.) { o = vec4(vec3(.11), 1.); return; }
  vec3 c = texture(uSrc, uv).rgb;
  if (uAntes > .5 || (uDiv >= 0. && vUV.x < uDiv)) { o = vec4(c, 1.); return; }
  vec3 s = texture(uS, uv).rgb, m = texture(uM, uv).rgb, l = texture(uL, uv).rgb, h = texture(uH, uv).rgb;

  /* aberración cromática: el rojo y el azul se corrigen en escala radial */
  if (uOpt.x != 0.) { float k = uOpt.x * .003; c.r = texture(uSrc, .5 + (uv - .5) * (1. + k)).r; c.b = texture(uSrc, .5 + (uv - .5) * (1. - k)).b; }

  /* Quitar: cada mancha copia otra zona; en modo recuperar, iguala el color y la luz del entorno */
  for (int i = 0; i < 64; i++) {
    if (i >= uNS) break;
    vec4 t0 = texelFetch(uManchas, ivec2(i * 2, 0), 0), t1 = texelFetch(uManchas, ivec2(i * 2 + 1, 0), 0);
    float dist = length((uv - t0.xy) * uAsp);
    if (dist >= t0.z) continue;
    float w = (1. - smoothstep(t0.z * (1. - t0.w), t0.z, dist)) * t1.w;
    vec2 uv2 = uv + (t1.xy - t0.xy);
    vec3 cc = texture(uSrc, uv2).rgb, ss = texture(uS, uv2).rgb;
    if (t1.z > .5) { vec3 corr = texture(uM, uv).rgb - texture(uM, uv2).rgb; cc += corr; ss += corr; }
    c = mix(c, cc, w); s = mix(s, ss, w);
  }
  vec3 c0 = c, det = c - l;

  /* desenfoque de lente: todo lo que está fuera del área de enfoque se suaviza */
  if (uDes.x > 0.) {
    vec2 v = (uv - uDes.yz) * uAsp; float ca = cos(uDes2.z), sa = sin(uDes2.z);
    v = vec2(ca * v.x + sa * v.y, -sa * v.x + ca * v.y);
    float e = length(v / max(uDes2.xy, vec2(1e-4))), f = max(uDes.w, .02);
    float b = smoothstep(1. - f, 1. + f, e) * uDes.x;
    vec3 bl = mix(m, l, smoothstep(.3, 1., b));
    float k = smoothstep(0., .35, b);
    c = mix(c, bl, k); s = mix(s, bl, k); det *= 1. - k;
  }

  /* reducción de ruido: suaviza donde no hay bordes; el detalle sube el umbral de lo que se respeta */
  float nr = uA4.w;
  if (nr > 0.) { float e = length(c - s); c = mix(c, mix(s, m, nr * .35), nr * (1. - smoothstep(.015, mix(.24, .06, uA6.z) * (.6 + nr), e))); }
  if (uA5.x > 0.) c += ((m - vec3(lum(m))) - (c - vec3(lum(c)))) * uA5.x;
  /* nitidez con radio, detalle (cuánto halo se permite) y máscara (solo en bordes) */
  if (uA4.y > 0.) {
    vec3 d = c - mix(s, m, uA4.z * .6); float lim = mix(.03, .3, uA6.x);
    d = clamp(d * mix(.7, 1.3, uA6.x), -lim, lim);
    float wm = uA6.y > 0. ? smoothstep(uA6.y * .06, uA6.y * .06 + .05, length(s - m)) : 1.;
    c += d * uA4.y * 1.6 * wm;
  }
  /* desfleco: apaga orillas púrpura y verde junto a bordes de alto contraste */
  if (uOpt.y + uOpt.z > 0.) {
    float e = clamp(length(c - m) * 6., 0., 1.); float hd = rgb2hsv(c).x * 360.;
    float wp = 1. - smoothstep(10., 45., abs(hd - 295.)), wg = 1. - smoothstep(10., 40., abs(hd - 120.));
    c = mix(c, vec3(lum(c)), clamp(e * (uOpt.y * wp + uOpt.z * wg) * 1.5, 0., 1.));
  }
  /* textura, claridad y neblina */
  c += (s - m) * uA3.z * 1.3;
  float Lm = lum(c); c += det * uA3.w * .9 * 4. * Lm * (1. - Lm);
  if (uA4.x != 0.) c = neblina(c, uA4.x, h);

  /* exposición, balance de blancos y viñeteado del objetivo en luz lineal */
  vec3 lin = pow(max(c, 0.), vec3(2.2)) * exp2(uA1.x) * balance(uA2.z, uA2.w);
  if (uOpt.w != 0.) { float rr = length((uv - .5) * uAsp) / length(uAsp * .5); lin *= 1. + uOpt.w * 1.2 * pow(rr, 1. + 3. * uOpt2.x); }
  c = pow(lin, vec3(1. / 2.2));
  /* tono */
  float L = lum(c);
  c = clamp(aplicarL(c, L, tono(L, uA1.y, uA1.z, uA1.w, uA2.x, uA2.y)), 0., 1.);
  /* curva de tonos (incluye la del perfil y la paramétrica) */
  vec3 k = c * (255. / 256.) + .5 / 256.;
  c = vec3(texture(uCurva, vec2(k.r, .5)).r, texture(uCurva, vec2(k.g, .5)).g, texture(uCurva, vec2(k.b, .5)).b);

  /* mezcla de color por bandas de tono; en blanco y negro, la luminancia de cada banda arma la mezcla de grises */
  vec3 hsv = rgb2hsv(c), acc = vec3(0.); float ws = 0., hd = hsv.x * 360.;
  for (int i = 0; i < 8; i++) {
    float d = abs(hd - TONOS[i]); d = min(d, 360. - d);
    float w = max(0., 1. - d / 50.); w = w * w * (3. - 2. * w);
    acc += uMez[i] * w; ws += w;
  }
  acc /= max(ws, 1.);
  if (uOpt2.y > .5) {
    c = vec3(clamp(lum(c) * (1. + acc.z * .9 * smoothstep(.02, .2, hsv.y)), 0., 1.));
  } else {
    if (ws > 0.) {
      float sw = smoothstep(.03, .25, hsv.y);
      hsv.x = fract(hsv.x + acc.x * sw * 30. / 360.);
      hsv.y = clamp(hsv.y * (1. + acc.y * sw), 0., 1.);
      c = hsv2rgb(hsv) * (1. + acc.z * .5 * sw * min(1., hsv.y * 1.5));
    }
    /* intensidad (protege lo ya saturado) y saturación */
    float Ls = lum(c), sat = max(c.r, max(c.g, c.b)) - min(c.r, min(c.g, c.b));
    c = vec3(Ls) + (c - vec3(Ls)) * max(0., 1. + uA3.y + uA3.x * (1. - min(1., sat * 1.4)));
  }

  /* gradación de color: sombras, medios, luces y global */
  float Lg = lum(c), p = .5 + uGradMB.y * .25, wd = .2 + uGradMB.x * .45;
  float wS = 1. - smoothstep(p - wd, p + wd * .3, Lg), wH = smoothstep(p - wd * .3, p + wd, Lg), wM = clamp(1. - wS - wH, 0., 1.);
  c += uGrad[0].rgb * wS + uGrad[1].rgb * wM + uGrad[2].rgb * wH + uGrad[3].rgb;
  c += (uGrad[0].w * wS + uGrad[1].w * wM + uGrad[2].w * wH + uGrad[3].w) * .25;

  /* máscaras: 0 lineal, 1 radial, 2 pincel, 3 rango de luminancia, 4 rango de color */
  vec2 q = uv * uAsp; float ver = 0.;
  for (int i = 0; i < 8; i++) {
    if (i >= uNM) break;
    vec4 g0 = uMG[i * 3], g1 = uMG[i * 3 + 1], g2 = uMG[i * 3 + 2];
    float w, t = g0.x;
    if (t < .5) {
      vec2 A = g1.xy * uAsp, d = g1.zw * uAsp - A;
      w = 1. - smoothstep(0., 1., dot(q - A, d) / max(dot(d, d), 1e-6));
    } else if (t < 1.5) {
      vec2 v = q - g1.xy * uAsp; float ca = cos(g0.w), sa = sin(g0.w);
      v = vec2(ca * v.x + sa * v.y, -sa * v.x + ca * v.y);
      float e = length(v / max(g1.zw, vec2(1e-4))), f = max(g2.x, .02);
      w = 1. - smoothstep(1. - f, 1., e);
    } else if (t < 2.5) {
      vec4 pc = texture(uPincel, uv); w = g0.w < .5 ? pc.r : g0.w < 1.5 ? pc.g : g0.w < 2.5 ? pc.b : pc.a;
    } else if (t < 3.5) {
      float L0 = lum(c0), sv = max(g2.z, .01);
      w = smoothstep(g2.x - sv, g2.x, L0) * (1. - smoothstep(g2.y, g2.y + sv, L0));
    } else {
      vec3 a = c0 - vec3(lum(c0)), b = g2.rgb - vec3(lum(g2.rgb));
      float d = length(a - b) * 2. + abs(lum(c0) - lum(g2.rgb)) * .5;
      w = 1. - smoothstep(g1.x * .5, g1.x, d);
    }
    if (g0.y > .5) w = 1. - w;
    w *= g0.z;
    if (i == uVerM) ver = w;
    if (w > 0.) c = local(c, w, uMA[i * 4], uMA[i * 4 + 1], uMA[i * 4 + 2], uMA[i * 4 + 3], det, s, m, h);
  }
  if (uVerM >= 0) c = mix(c, vec3(1., .18, .22), ver * .45);

  /* viñeta tras el recorte, con prioridad de altas luces */
  if (uVin.x != 0.) {
    float kr = (uVin.z + 1.) * .5, asp = mix(1., uSal.x / uSal.y, kr);
    float d = length((vUV - .5) * vec2(asp, 1.)) / length(vec2(asp, 1.) * .5);
    float m0 = mix(.2, .9, uVin.y), f = mix(.05, .8, uVin.w);
    float vv = smoothstep(m0 - f * .5, m0 + f * .5, d);
    c = uVin.x < 0. ? c * (1. + uVin.x * vv * .95 * (1. - uA6.w * smoothstep(.55, 1., lum(c)))) : mix(c, vec3(1.), uVin.x * vv * .85);
  }
  /* grano: igual en vista previa y exportación porque se mide sobre el tamaño de salida */
  if (uA5.y > 0.) {
    float cel = (1. + uA5.z * 3.) * max(uSal.x, uSal.y) / 2048.;
    vec2 g = vUV * uSal / cel;
    float n = mix(ruidoValor(g), hash(floor(g * 2.) + uSemilla), uA5.w * .6) - .5, Ln = lum(c);
    c += n * uA5.y * .22 * (.35 + 2.6 * Ln * (1. - Ln));
  }
  c = clamp(c, 0., 1.);
  /* avisos de recorte: rojo donde se queman las luces y azul donde se pierden las sombras */
  if (uAvisos > .5) { if (max(c.r, max(c.g, c.b)) > .996) c = vec3(1., .15, .15); else if (max(c.r, max(c.g, c.b)) < .006) c = vec3(.1, .35, 1.); }
  o = vec4(c, 1.);
}`;

/* ---------- geometría ----------
   Matrices afines [a,b,c,d,e,f]: x' = a x + b y + c, y' = d x + e y + f. Se componen de la salida hacia la foto
   en dos tramos: salida > marco orientado (recorte y enderezar) y marco orientado > foto (volteos y giros de 90°).

const afMul = (A, B) => [A[0] * B[0] + A[1] * B[3], A[0] * B[1] + A[1] * B[4], A[0] * B[2] + A[1] * B[5] + A[2],

      if (marca === 0xFFE1 && b.getUint32(p + 4) === 0x45786966) return exifTiff(b, p + 10);

      p += 2 + largo;
    }
  } catch (_) {}
  return null;
}

function exifTiff(b, t){
  const le = b.getUint16(t) === 0x4949;
  const u16 = o => b.getUint16(t + o, le), u32 = o => b.getUint32(t + o, le);
  const TAMS = { 1:1, 2:1, 3:2, 4:4, 5:8, 7:1, 9:4, 10:8 };
  const leerIFD = (o, out) => {
    const n = u16(o);
    for (let i = 0; i < n; i++) {
      const e = o + 2 + i * 12, tag = u16(e), tipo = u16(e + 2), cnt = u32(e + 4), tam = (TAMS[tipo] || 1) * cnt;
      const vo = tam > 4 ? u32(e + 8) : e + 8;
      let v;
      if (tipo === 2) { v = ''; for (let k = 0; k < cnt - 1; k++) v += String.fromCharCode(b.getUint8(t + vo + k)); v = v.trim(); }
      else if (tipo === 3) v = u16(vo);
      else if (tipo === 4) v = u32(vo);
      else if (tipo === 5 || tipo === 10) { const nu = tipo === 5 ? u32(vo) : b.getInt32(t + vo, le), de = tipo === 5 ? u32(vo + 4) : b.getInt32(t + vo + 4, le); v = de ? nu / de : 0; }
      out[tag] = v;
    }
  };
  const ifd0 = {}, sub = {};
  leerIFD(u32(4), ifd0);
  if (ifd0[0x8769]) leerIFD(ifd0[0x8769], sub);
  const exp = sub[0x829A], fecha = sub[0x9003] || ifd0[0x0132];
  const d = {
    camara:[ifd0[0x010F], ifd0[0x0110]].filter(Boolean).join(' ').replace(/^(\w+) \1 /i, '$1 ') || '',
    objetivo:sub[0xA434] || '',
    iso:sub[0x8827] ? 'ISO ' + sub[0x8827] : '',
    apertura:sub[0x829D] ? 'ƒ/' + (+sub[0x829D].toFixed(1)) : '',
    velocidad:exp ? (exp >= 1 ? exp + ' s' : '1/' + Math.round(1 / exp) + ' s') : '',
    focal:sub[0x920A] ? Math.round(sub[0x920A]) + ' mm' : '',
  };
  if (fecha && /^\d{4}:\d\d:\d\d \d\d:\d\d/.test(fecha)) { const [f, h] = fecha.split(' '); d.fecha = new Date(f.replace(/:/g, '-') + 'T' + h).getTime(); }
  return Object.values(d).some(Boolean) ? d : null;
}

/* Biblioteca: fotos guardadas solo en el dispositivo (IndexedDB), la vista en rejilla con filtros
   (editadas, estrellas, marcas y álbumes), orden por fecha de captura o de importación, y la selección
   múltiple para pegar ajustes, agregar a un álbum, exportar o eliminar.
   Cada foto guarda el original intacto aparte (almacén "originales") y en "fotos" sus datos livianos:
   ajustes, versiones, estrellas, marca, álbumes, datos de cámara y la miniatura ya revelada. */

const DB = (() => {
  let db = null;
  const pedir = r => new Promise((ok, mal) => { r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error); });
  const tx = (almacen, modo = 'readonly') => db.transaction(almacen, modo).objectStore(almacen);
  return {
    async abrir(){
      const r = indexedDB.open('revelado', 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        for (const n of ['fotos', 'originales', 'presets', 'albumes']) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath:'id' });
      };
      db = await pedir(r);
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) {}
    },
    todas: () => pedir(tx('fotos').getAll()),
    guardar: f => pedir(tx('fotos', 'readwrite').put(f)),
    original: async id => (await pedir(tx('originales').get(id)))?.blob,
    async eliminar(id){ await pedir(tx('fotos', 'readwrite').delete(id)); await pedir(tx('originales', 'readwrite').delete(id)); },
    async agregarOriginal(id, blob){ await pedir(tx('originales', 'readwrite').put({ id, blob })); },
    presets: () => pedir(tx('presets').getAll()),
    guardarPreset: p => pedir(tx('presets', 'readwrite').put(p)),
    eliminarPreset: id => pedir(tx('presets', 'readwrite').delete(id)),
    albumes: () => pedir(tx('albumes').getAll()),
    guardarAlbum: a => pedir(tx('albumes', 'readwrite').put(a)),
    eliminarAlbum: id => pedir(tx('albumes', 'readwrite').delete(id)),
  };
})();

/* Estado de la biblioteca en memoria */
const BIB = { fotos:[], albumes:[], filtro:'todas', orden:'captura', seleccionando:false, sel:new Set(), urls:new Map() };
try { BIB.orden = localStorage.getItem('revelado.orden') || 'captura'; } catch (_) {}
let PORTAPAPELES = null; /* ajustes copiados (y qué grupos) para pegar en otras fotos */
try { PORTAPAPELES = JSON.parse(localStorage.getItem('revelado.copiados') || 'null'); } catch (_) {}

/* Abre un archivo de imagen respetando la orientación de la cámara */
async function decodificar(blob){
  try { return await createImageBitmap(blob, { imageOrientation:'from-image' }); }
  catch (_) {
    const url = URL.createObjectURL(blob), img = new Image();
    try { img.src = url; await img.decode(); return img; } finally { setTimeout(() => URL.revokeObjectURL(url), 1000); }
  }
}
const aBlob = (canvas, tipo = 'image/jpeg', q = .86) => new Promise(r => canvas.toBlob(r, tipo, q));
function imagenACanvas(img){ const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; c.getContext('2d').putImageData(img, 0, 0); return c; }

/* Miniatura revelada con los ajustes actuales (lado mayor 480 px) */
async function miniatura(foto, imagen = null){
  const img = imagen || await decodificar(await DB.original(foto.id));
  const f = Motor.fuente(img, 480), [Wo, Ho] = marcoOrientado(foto.ajustes.geo, f.w, f.h);
  const g = foto.ajustes.geo, k = 480 / Math.max(g.w * Wo, g.h * Ho);
  const px = Motor.revelar(f, foto.ajustes, { ancho:Math.max(1, Math.round(g.w * Wo * k)), alto:Math.max(1, Math.round(g.h * Ho * k)), destino:'pixeles' });
  f.liberar();
  return aBlob(imagenACanvas(px), 'image/jpeg', .82);
}

async function importarArchivos(archivos){
  const lista = [...archivos].filter(a => a.type.startsWith('image/') || /\.(heic|heif|jpe?g|png|webp)$/i.test(a.name));
  if (!lista.length) return toast('Esos archivos no son fotos');
  const album = BIB.filtro.startsWith('a:') ? BIB.filtro.slice(2) : null; /* importar dentro de un álbum abierto lo agrega ahí */
  let hechas = 0, fallas = 0;
  for (const a of lista) {
    toast('Importando ' + (hechas + 1) + ' de ' + lista.length, 60000);
    try {
      const img = await decodificar(a), id = uid(), exif = await leerExif(a);
      const foto = { id, nombre:a.name.replace(/\.[^.]+$/, '') || 'Foto', fecha:Date.now(), tomada:(exif && exif.fecha) || a.lastModified || Date.now(),
        w:img.width, h:img.height, exif, ajustes:ajustesBase(), versiones:[], estrellas:0, marca:'', albumes:album ? [album] : [], editada:false, mini:null };
      foto.mini = await miniatura(foto, img);
      await DB.agregarOriginal(id, a); await DB.guardar(foto);
      BIB.fotos.push(foto); hechas++;
    } catch (e) { fallas++; console.error(e); }
  }
  pintarBiblioteca();
  toast(fallas ? 'Se importaron ' + hechas + '. ' + fallas + ' no se pudieron abrir (prueba JPG o PNG).' : (hechas === 1 ? 'Foto importada' : hechas + ' fotos importadas'), 2600);
}

/* ---------- vista ---------- */
function urlMini(f){
  const prev = BIB.urls.get(f.id);
  if (prev && prev.blob === f.mini) return prev.url;
  if (prev) URL.revokeObjectURL(prev.url);
  const url = f.mini ? URL.createObjectURL(f.mini) : ''; BIB.urls.set(f.id, { blob:f.mini, url }); return url;
}
const FILTROS = [['todas', 'Todas'], ['editadas', 'Editadas'], ['estrellas', 'Con estrellas'], ['elegidas', 'Elegidas'], ['rechazadas', 'Rechazadas']];
function fotosVisibles(){

  const f = BIB.filtro;
  if (f.startsWith('a:')) return ord.filter(x => (x.albumes || []).includes(f.slice(2)));
  return ord.filter(x => f === 'editadas' ? x.editada : f === 'estrellas' ? x.estrellas > 0 : f === 'elegidas' ? x.marca === 'elegida' : f === 'rechazadas' ? x.marca === 'rechazada' : true);
}

function salirSeleccion(){ BIB.seleccionando = false; BIB.sel.clear(); pintarBiblioteca(); }

async function accionSeleccion(accion){
  const ids = [...BIB.sel], fotos = BIB.fotos.filter(f => BIB.sel.has(f.id));
  if (accion === 'calificar') return hojaCalificar(fotos, salirSeleccion);
  if (accion === 'album') return hojaAlbum(fotos);
  if (accion === 'exportar') return hojaExportar(fotos);
  if (accion === 'eliminar') {
    const ok = await confirmar(ids.length === 1 ? 'Eliminar foto' : 'Eliminar ' + ids.length + ' fotos', 'Se borran de Revelado con sus ediciones. Las fotos de tu galería no se tocan.', 'peligro');
    if (!ok) return;
    for (const id of ids) { await DB.eliminar(id); const u = BIB.urls.get(id); if (u) URL.revokeObjectURL(u.url); BIB.urls.delete(id); }
    BIB.fotos = BIB.fotos.filter(f => !BIB.sel.has(f.id)); toast(ids.length === 1 ? 'Foto eliminada' : ids.length + ' fotos eliminadas'); return salirSeleccion();
  }
  if (accion === 'pegar' && PORTAPAPELES) {
    let i = 0;
    for (const f of fotos) {
      toast('Pegando ajustes ' + (++i) + ' de ' + fotos.length, 60000);
      f.ajustes = pegarAjustes(f.ajustes); f.editada = ajustesEditados(f.ajustes);
      f.mini = await miniatura(f); await DB.guardar(f);
    }
    toast('Ajustes pegados en ' + fotos.length + (fotos.length === 1 ? ' foto' : ' fotos')); salirSeleccion();
  }
}

/* Pega los grupos copiados sobre unos ajustes */

/* ---------- foto de ejemplo: atardecer sobre montañas y un lago, dibujado en el momento ---------- */
async function fotoEjemplo(){
  const c = document.createElement('canvas'); c.width = 2400; c.height = 1600;
  const x = c.getContext('2d'), w = c.width, h = c.height, hz = h * .62;
  let g = x.createLinearGradient(0, 0, 0, hz); g.addColorStop(0, '#1c2a52'); g.addColorStop(.55, '#b5546d'); g.addColorStop(1, '#f3a85c');
  x.fillStyle = g; x.fillRect(0, 0, w, hz);
  const sx = w * .66, sy = hz - 45, r = x.createRadialGradient(sx, sy, 0, sx, sy, w * .35);
  r.addColorStop(0, 'rgba(255,236,190,.95)'); r.addColorStop(.08, 'rgba(255,214,150,.7)'); r.addColorStop(1, 'rgba(255,180,120,0)');
  x.fillStyle = r; x.fillRect(0, 0, w, hz);
  const cresta = (base, amp, col, s) => { x.beginPath(); x.moveTo(0, hz); for (let i = 0; i <= w; i += 8) x.lineTo(i, base - amp * (.55 * Math.sin(i * .0027 + s) + .3 * Math.sin(i * .0073 + s * 2) + .15 * Math.sin(i * .021 + s * 3))); x.lineTo(w, hz); x.closePath(); x.fillStyle = col; x.fill(); };
  cresta(hz - 105, 135, '#6b3d5c', 1.3); cresta(hz - 38, 105, '#3e2741', 4.1); cresta(hz + 3, 60, '#22172a', 2.2);
  x.save(); x.translate(0, hz * 2); x.scale(1, -1); x.globalAlpha = .55; x.drawImage(c, 0, 0, w, hz, 0, 0, w, hz); x.restore();
  g = x.createLinearGradient(0, hz, 0, h); g.addColorStop(0, 'rgba(20,16,34,.35)'); g.addColorStop(1, 'rgba(10,10,20,.9)'); x.fillStyle = g; x.fillRect(0, hz, w, h - hz);
  x.globalAlpha = .25; x.strokeStyle = '#ffd9a0';
  for (let i = 0; i < 70; i++) { const y = hz + 12 + Math.pow(i / 70, 1.6) * (h - hz), l = 60 + Math.random() * 240; x.lineWidth = 1 + i / 30; x.beginPath(); x.moveTo(sx - l / 2 + (Math.random() - .5) * 90, y); x.lineTo(sx + l / 2, y); x.stroke(); }
  x.globalAlpha = 1;
  const blob = await aBlob(c, 'image/jpeg', .92);
  await importarArchivos([new File([blob], 'Atardecer de ejemplo.jpg', { type:'image/jpeg', lastModified:Date.now() })]);
}

/* Deslizador táctil al estilo Lightroom.
   Se arrastra desde cualquier punto de la fila (el valor se mueve en relación al dedo, sin saltos al tocar),
   el desplazamiento vertical sigue funcionando para recorrer el panel, tiene un leve imán en el valor
   por defecto, y un doble toque lo devuelve a ese valor. También responde a las flechas del teclado. */

function deslizador(def, obtener, fijar){
  const min = def.min ?? -100, max = def.max ?? 100, paso = def.paso ?? 1, base = def.base ?? DEF[def.k] ?? 0;
  const el = document.createElement('div');
  el.className = 'ctl'; el.tabIndex = 0; el.dataset.k = def.k;
  el.setAttribute('role', 'slider'); el.setAttribute('aria-label', def.nom);
  el.setAttribute('aria-valuemin', min); el.setAttribute('aria-valuemax', max);
  el.innerHTML = '<span class="nom">' + esc(def.nom) + '</span><span class="val"></span><div class="pista"><div class="relleno"></div><div class="perilla"></div></div>';
  if (def.riel) el.style.setProperty('--riel', def.riel);
  const pista = $('.pista', el), relleno = $('.relleno', el), perilla = $('.perilla', el), val = $('.val', el);
  const fmt = v => paso < 1 ? (v > 0 ? '+' : '') + v.toFixed(2) : (v > 0 && min < 0 ? '+' : '') + Math.round(v);
  const pct = v => (v - min) / (max - min) * 100;

  el.sync = () => {
    const v = obtener(def.k), p = pct(v), b = pct(clamp(base, min, max));
    perilla.style.left = p + '%';
    relleno.hidden = !!def.riel;
    relleno.style.left = Math.min(p, b) + '%'; relleno.style.width = Math.abs(p - b) + '%';
    val.textContent = fmt(v); el.classList.toggle('cambiado', v !== base);
    el.setAttribute('aria-valuenow', v); el.setAttribute('aria-valuetext', fmt(v));
  };
  const poner = (v, final) => {
    v = clamp(Math.round(v / paso) * paso, min, max);
    if (Math.abs(v - base) < (max - min) * .006) v = base;   /* imán en el valor por defecto */
    v = +v.toFixed(4);
    if (v !== obtener(def.k) || final) fijar(def.k, v, final);
    el.sync();
  };

  let x0 = 0, v0 = 0, ancho = 1, id = null, arrastra = false, ultimoToque = 0;
  el.addEventListener('pointerdown', e => {
    if (e.button) return;
    id = e.pointerId; x0 = e.clientX; v0 = obtener(def.k); ancho = pista.getBoundingClientRect().width || 1; arrastra = false;
  });
  el.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    const dx = e.clientX - x0;
    if (!arrastra) {
      if (Math.abs(dx) < 5) return;
      arrastra = true; el.setPointerCapture(id); el.classList.add('arrastrando'); x0 = e.clientX;
      if (def.avisos) { ED.avisosTemp = true; pedirPintura(); } /* muestra qué se quema o se pierde mientras arrastras */
      return;
    }
    poner(v0 + dx / ancho * (max - min), false);
  });
  const soltar = e => {
    if (e.pointerId !== id) return; id = null;
    if (arrastra) { arrastra = false; el.classList.remove('arrastrando'); if (def.avisos) ED.avisosTemp = false; poner(obtener(def.k), true); return; }
    if (e.type !== 'pointerup') return;
    const ahora = Date.now();
    if (ahora - ultimoToque < 320) { ultimoToque = 0; poner(base, true); } else ultimoToque = ahora;
  };
  el.addEventListener('pointerup', soltar); el.addEventListener('pointercancel', soltar);
  el.addEventListener('keydown', e => {
    const d = { ArrowRight:1, ArrowUp:1, ArrowLeft:-1, ArrowDown:-1 }[e.key];
    if (d) { e.preventDefault(); poner(obtener(def.k) + d * paso * (e.shiftKey ? 10 : 1), true); }
    else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); poner(base, true); }
  });
  el.sync();
  return el;
}

/* Paneles de Luz, Color, Efectos, Detalle, Óptica y Geometría: deslizadores ligados al ajuste abierto,
   subvistas de Curva, Mezcla de color y Gradación, perfiles, tratamiento, balance de blancos (Como se tomó,
   Automático y el selector), Auto y el punto de "editado" en cada pestaña. */

/* Deslizador ligado a una clave del ajuste de la foto abierta */
const ctlAjuste = def => deslizador(def, k => ED.a[k], (k, v, final) => { ED.a[k] = v; if (k === 'temperatura' || k === 'matiz') ED.a.bbAuto = false; cambiar(final); });

/* Cabecera de panel con título y acciones a la derecha */
const pcab = (titulo, acciones = '') => '<div class="pcab"><h2>' + esc(titulo) + '</h2><span>' + acciones + '</span></div>';
const filaNav = (clave, nombre, valor = '') => '<button class="fila-nav" data-sub="' + clave + '"><b>' + esc(nombre) + '</b><span>' + valor + ICO.chev + '</span></button>';
/* Cabecera de subvista: volver a la izquierda, como en iOS */
const pcabSub = (titulo, acciones = '') => '<div class="pcab"><button class="txt volver-sub" data-volver-sub aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 class="flex">' + esc(titulo) + '</h2><span>' + acciones + '</span></div>';
const ICO_GOTERO = '<svg viewBox="0 0 24 24"><path d="m14 4 6 6"/><path d="m17 7 2-2a1.4 1.4 0 0 0-2-2l-2 2"/><path d="M15.5 8.5 7 17l-3 1 1-3 8.5-8.5"/></svg>';

function construirPaneles(){
  /* Luz */
  const luz = $('#p-luz');
  luz.innerHTML = '<div class="principal">' + pcab('Luz', '<button class="txt" data-auto>Auto</button><button class="txt" data-reset="luz">Restablecer</button>') + '<div class="ctls"></div>' + filaNav('curva', 'Curva') + '</div><div class="subvista" hidden></div>';
  PANELES.luz.forEach(d => $('.ctls', luz).appendChild(ctlAjuste(d)));

  /* Color: tratamiento, perfil y balance de blancos arriba, como en Lightroom */
  const color = $('#p-color');
  color.innerHTML = '<div class="principal">' + pcab('Color', '<button class="txt" data-reset="color">Restablecer</button>') +
    '<div class="segmento" id="tratamiento" role="tablist"><button data-trat="color">Color</button><button data-trat="bn">Blanco y negro</button></div>' +
    '<button class="fila-nav" data-perfiles><b>Perfil</b><span><span id="perfil-nom"></span>' + ICO.chev + '</span></button>' +
    '<div class="fila-bb"><span>Balance de blancos</span><div class="chips"><button data-bb="como">Como se tomó</button><button data-bb="auto">Automático</button>' +
    '<button data-bb="gotero" aria-label="Selector de balance de blancos" title="Toca algo que deba verse gris">' + ICO_GOTERO + '</button></div></div>' +
    '<div class="ctls"></div>' + filaNav('mezcla', 'Mezcla de color') + filaNav('gradacion', 'Gradación de color') + '</div><div class="subvista" hidden></div>';
  PANELES.color.forEach(d => $('.ctls', color).appendChild(ctlAjuste(d)));

  /* Efectos, Detalle y Óptica */
  const notas = {
    detalle:'Acerca la foto al 100 % (doble toque) para juzgar la nitidez y el ruido.',
    optica:'Corrige a mano lo que el objetivo deja en la foto: orillas de color en los bordes y esquinas más oscuras.',
  };
  const titulos = { efectos:'Efectos', detalle:'Detalle', optica:'Óptica' };
  for (const p of ['efectos', 'detalle', 'optica']) {

    el.innerHTML = pcab(titulos[p], '<button class="txt" data-reset="' + p + '">Restablecer</button>') + '<div class="ctls"></div>' + (notas[p] ? '<p class="nota">' + notas[p] + '</p>' : '');
    PANELES[p].forEach(d => { const c = ctlAjuste(d); if (d.depende) c.dataset.depende = d.depende; $('.ctls', el).appendChild(c); });
  }

    '<div class="chips"><button data-restringir>Restringir recorte</button></div><div class="ctls"></div>' +
    '<p class="nota">Vertical y Horizontal corrigen la perspectiva de edificios; Distorsión, el efecto de barril de los gran angulares.</p>';
  PANELES.geometria.forEach(d => $('.ctls', geo).appendChild(ctlAjuste(d)));

  $('#panel').addEventListener('click', e => {

      if (r.dataset.reset === 'color') { ED.a.perfil = clonar(PERFIL_DEF); ED.a.bbAuto = false; }
